services:
  app:
    image: ghcr.io/michaelayoade/dotmac_erp:${ERP_IMAGE_TAG:-latest}
    platform: linux/amd64
    container_name: dotmac_erp_app
    restart: unless-stopped
    # LOOPBACK ONLY, one entry per address family, long syntax.
    #
    # `- "8003:8002"` published on 0.0.0.0 AND [::] simultaneously: Docker
    # spawns one docker-proxy per family for a short-form publish. That put
    # plaintext HTTP for this app on a routable address in both families,
    # bypassing the nginx TLS vhost in front of it — and it was actively
    # scanned (Shodan, Censys). The only legitimate consumer is nginx on this
    # host, via `upstream dotmac_erp { server 127.0.0.1:8003; }`; a 24h access
    # log sample found zero non-loopback client IPs across 21,587 requests.
    #
    # Naming a host_ip is what fixes it. The IPv6 half CANNOT be fixed with a
    # firewall rule: with an IPv4-only docker network there is no IPv6 DNAT, so
    # an inbound v6 connection is accepted by docker-proxy as a local process
    # and traverses INPUT, while DOCKER-USER is only ever jumped from FORWARD.
    # Every `ip6tables DOCKER-USER` rule against a published port sits at zero
    # packets forever. Binding the listener is the fix, not filtering it.
    #
    # Both families are named explicitly rather than left implicit, so the
    # binding is reviewable and a future short form is an obvious regression.
    # Changing this requires `docker compose up -d app` to RECREATE the
    # container; `docker compose restart` re-runs the existing container object
    # with its existing HostConfig.PortBindings and has no effect.
    ports:
    - target: 8002
      published: "8003"
      host_ip: "127.0.0.1"
      protocol: tcp
    - target: 8002
      published: "8003"
      host_ip: "::1"
      protocol: tcp
    env_file:
    - .env
    environment:
      APP_URL: https://erp.dotmac.io
      APP_VERSION: ${APP_VERSION:-1.33.4}
      DOTMAC_DEV_MODE: ${DOTMAC_DEV_MODE:?Set DOTMAC_DEV_MODE explicitly}
      BANKING_AUTO_MATCH_ENABLED: ${BANKING_AUTO_MATCH_ENABLED:-false}
      DEFAULT_ORGANIZATION_ID: 00000000-0000-0000-0000-000000000001
      TRUSTED_PROXY_IPS: 172.16.0.0/12,127.0.0.1
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/1
      CSP_ALLOW_UNSAFE: 'true'
      OPENBAO_ADDR: ${OPENBAO_ADDR}
      OPENBAO_TOKEN: ${OPENBAO_TOKEN:-devtoken}
      OPENBAO_ALLOW_INSECURE: 'true'
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-dotmac-erp}
      GUNICORN_WORKERS: '4'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPYCACHEPREFIX: /tmp/pycache
    depends_on:
      redis:
        condition: service_started
    volumes:
    - dotmac_logs:/var/log/dotmac
    - ./static:/app/static:ro
    - ./templates:/app/templates:ro
    - ./license:/app/license:ro
    - ./gunicorn.conf.py:/app/gunicorn.conf.py:ro
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://localhost:8002/health/ready')
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    command:
    - gunicorn
    - -c
    - gunicorn.conf.py
    - app.main:app
  app-dev:
    build:
      context: .
      secrets:
      - forgejo_token
    platform: linux/amd64
    container_name: dotmac_erp_app_dev
    restart: unless-stopped
    profiles:
    - dev
    ports:
    - 8002:8002
    env_file:
    - .env
    environment:
      APP_URL: https://erp.dotmac.io
      DOTMAC_DEV_MODE: 'true'
      BANKING_AUTO_MATCH_ENABLED: ${BANKING_AUTO_MATCH_ENABLED:-false}
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/1
      OPENBAO_ADDR: ${OPENBAO_ADDR}
      OPENBAO_TOKEN: ${OPENBAO_TOKEN:-devtoken}
      OPENBAO_ALLOW_INSECURE: 'true'
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-dotmac-erp}
    depends_on:
      redis:
        condition: service_started
    volumes:
    - .:/app
    command:
    - uvicorn
    - app.main:app
    - --host
    - 0.0.0.0
    - --port
    - '8002'
  worker:
    image: ghcr.io/michaelayoade/dotmac_erp:${ERP_IMAGE_TAG:-latest}
    platform: linux/amd64
    container_name: dotmac_erp_worker
    restart: unless-stopped
    env_file:
    - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      BANKING_AUTO_MATCH_ENABLED: ${BANKING_AUTO_MATCH_ENABLED:-false}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/1
      OPENBAO_ADDR: ${OPENBAO_ADDR}
      OPENBAO_TOKEN: ${OPENBAO_TOKEN:-devtoken}
      OPENBAO_ALLOW_INSECURE: 'true'
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-dotmac-erp}
    depends_on:
      redis:
        condition: service_started
    command:
    - celery
    - -A
    - app.celery_app
    - worker
    - -l
    - info
  beat:
    image: ghcr.io/michaelayoade/dotmac_erp:${ERP_IMAGE_TAG:-latest}
    platform: linux/amd64
    container_name: dotmac_erp_beat
    restart: unless-stopped
    env_file:
    - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      BANKING_AUTO_MATCH_ENABLED: ${BANKING_AUTO_MATCH_ENABLED:-false}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/1
      OPENBAO_ADDR: ${OPENBAO_ADDR}
      OPENBAO_TOKEN: ${OPENBAO_TOKEN:-devtoken}
      OPENBAO_ALLOW_INSECURE: 'true'
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-dotmac-erp}
    depends_on:
      redis:
        condition: service_started
    command:
    - celery
    - -A
    - app.celery_app
    - beat
    - -l
    - info
  redis:
    image: redis:7
    platform: linux/amd64
    container_name: dotmac_erp_redis
    restart: unless-stopped
    command:
    - redis-server
    - --requirepass
    - ${REDIS_PASSWORD:-redis}
    ports:
    - 127.0.0.1:6382:6379

  # ===========================================================================
  # Observability agents
  # ===========================================================================
  #
  # This app already exposed /metrics (app/main.py) and already had GlitchTip
  # wiring in app/monitoring.py — but nothing collected either, so the
  # deployment did not appear in Grafana or Loki at all. These agents close that
  # gap by pushing to the central Dotmac Observability stack.
  #
  # Both sit behind the `observability` compose profile so a developer running
  # `docker compose up` locally does not start shipping to production. Enable on
  # a real host with COMPOSE_PROFILES=observability in .env, so the ordinary
  # `docker compose up -d` includes them — no extra flag to remember on redeploy.
  promtail:
    image: grafana/promtail:3.0.0
    container_name: dotmac_erp_promtail
    restart: unless-stopped
    profiles: [observability]
    # -config.expand-env resolves the ${...} placeholders in the config file
    # from this container's environment, so endpoints live in .env rather than
    # being baked into a tracked file.
    command: -config.file=/etc/promtail/config.yml -config.expand-env=true
    environment:
      LOKI_PUSH_URL: ${LOKI_PUSH_URL:-http://LOKI_PUSH_URL-is-unset.invalid/loki/api/v1/push}
      DEPLOY_HOST: ${DEPLOY_HOST:-DEPLOY_HOST-is-unset}
      DEPLOY_ENV: ${DEPLOY_ENV:-production}
    volumes:
      - ./config/promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      # Read-only docker socket: promtail only discovers and tails containers,
      # it never needs to control them.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - promtail_positions:/positions
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  vmagent:
    image: victoriametrics/vmagent:v1.96.0
    container_name: dotmac_erp_vmagent
    restart: unless-stopped
    profiles: [observability]
    command:
    - -promscrape.config=/etc/vmagent/config.yml
    - -promscrape.config.strictParse=false
    - -remoteWrite.url=${VM_REMOTE_WRITE_URL:-http://VM_REMOTE_WRITE_URL-is-unset.invalid/api/v1/write}
    # Buffer locally when the central endpoint is unreachable rather than
    # dropping samples and leaving an unexplained hole in the series.
    - -remoteWrite.tmpDataPath=/vmagent-data
    - -remoteWrite.maxDiskUsagePerURL=512MB
    environment:
      DEPLOY_ENV: ${DEPLOY_ENV:-production}
    volumes:
      - ./config/vmagent/config.yml:/etc/vmagent/config.yml:ro
      - vmagent_data:/vmagent-data
    depends_on:
    - app
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

secrets:
  # Build-only private-package credential held outside the checkout. Override
  # the pointer without placing the token in Compose or any synchronized file.
  forgejo_token:
    file: ${FORGEJO_TOKEN_FILE:-/run/secrets/dotmac/forgejo-read-token}

volumes:
  dotmac_erp_db_data: null
  dotmac_logs: null
  promtail_positions: null
  vmagent_data: null
