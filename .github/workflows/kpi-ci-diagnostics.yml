name: KPI repair diagnostics

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  collect:
    if: github.head_ref == 'feature/people-performance-kpi-dashboard'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect tracked source and the pinned formatter
        run: |
          set -euo pipefail
          mkdir -p /tmp/kpi-ci-diagnostics
          git archive --format=tar.gz HEAD > /tmp/kpi-ci-diagnostics/source.tar.gz
          git rev-parse HEAD > /tmp/kpi-ci-diagnostics/checkout-sha.txt
          python -m pip download --only-binary=:all: --no-deps \
            'ruff==0.15.0' --dest /tmp/kpi-ci-diagnostics
      - uses: actions/upload-artifact@v4
        with:
          name: kpi-ci-diagnostics
          path: /tmp/kpi-ci-diagnostics/
          retention-days: 1
          if-no-files-found: error
