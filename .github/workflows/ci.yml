name: CI

on:
  # `dev` is the promotion branch and `integration/**` carries multi-PR
  # adoption programmes (kernel migration). Without both, a pull request into
  # either runs no CI at all and the whole batch meets it for the first time
  # on the way to main.
  push:
    branches: [main, dev, 'integration/**']
  pull_request:
    branches: [main, dev, 'integration/**']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.12"
  DATABASE_URL: "sqlite:///./test.db"
  SECRET_KEY: "ci-test-secret-key-not-for-production"  # pragma: allowlist secret
  REDIS_URL: "redis://localhost:6379/0"
  # Read auth for the private Forgejo PyPI index (Dotmac packages). Same
  # ci-reader pattern as dotmac_vendor_control_plane; token source of record
  # is OpenBao (secret/dotmac/forgejo/read-token).
  POETRY_HTTP_BASIC_FORGEJO_USERNAME: ci-reader
  POETRY_HTTP_BASIC_FORGEJO_PASSWORD: ${{ secrets.FORGEJO_READ_TOKEN }}

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ env.PYTHON_VERSION }}-${{ hashFiles('poetry.lock') }}

      - name: Install dependencies
        run: poetry install --only dev --no-interaction

      - name: Ruff check
        run: poetry run ruff check app/

      - name: Ruff format check
        run: poetry run ruff format --check app/

      - name: Session-context guard (no raw SessionLocal() in tasks)
        run: python3 scripts/check_session_context.py

  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ env.PYTHON_VERSION }}-${{ hashFiles('poetry.lock') }}

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Run mypy
        run: poetry run mypy app/ --no-incremental

  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ env.PYTHON_VERSION }}-${{ hashFiles('poetry.lock') }}

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Run tests with coverage
        run: poetry run pytest tests/ --ignore=tests/integration --ignore=tests/e2e --cov=app --cov-report=xml --cov-report=term-missing -q --timeout=60

      - name: Upload coverage
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ env.PYTHON_VERSION }}-${{ hashFiles('poetry.lock') }}

      - name: Install dependencies
        run: poetry install --only dev --no-interaction

      - name: Security lint (bandit via ruff)
        run: poetry run ruff check app/ --select S --ignore S110

  pre-commit:
    name: Pre-commit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: pre-commit/action@v3.0.1
        env:
          SKIP: semgrep  # semgrep needs poetry; covered by Security Scan job

  # This repo's detect-private-key hook is currently clean — no exclude list,
  # and pre-commit does run in CI. This job exists because that state is one
  # line away from the failure that hit dotmac_sub and dotmac_crm: a live
  # OpenVPN server key was committed there, detect-private-key caught it, and
  # the file was added to the hook's `exclude:` instead of the key being
  # removed. It stayed public for five months.
  #
  # Two off switches apply to the job above — an `exclude:` in
  # .pre-commit-config.yaml, and the SKIP env var already in use on the line
  # above for semgrep. Both are edits a hurried change can make without
  # anyone reading them as "disable the secret guard".
  #
  # So this check is separate and keys on content, not paths: a PEM header
  # with no encoded body (fixtures, form hints, docs) passes; real key
  # material fails. There is no allowlist to add a path to.
  secret-scan:
    name: Private Key Scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Scan tracked files for private key material
        run: bash scripts/ci/scan_private_keys.sh

  # ---------------------------------------------------------------------------
  # Docker Build & Health Check
  # Builds the multi-stage image (Node CSS + Python) and verifies the container
  # starts successfully and responds to health checks.
  # ---------------------------------------------------------------------------
  docker-build:
    name: Docker Build & Health Check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: dotmac-erp:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
          secrets: |
            forgejo_token=${{ secrets.FORGEJO_READ_TOKEN }}

      - name: Create CI network
        run: docker network create ci-net

      # `HOST_AUTH_METHOD=trust` lets the migration executor connect as
      # `app_admin` without provisioning a password for an ephemeral CI
      # container that is never reachable outside the job's network. The pragma
      # moves to the `run:` line because that is where detect-secrets attributes
      # a block-scalar match, and `#` cannot be appended to a `\`-continued
      # shell line.
      - name: Start PostgreSQL
        run: |  # pragma: allowlist secret
          docker run -d --name ci-db --network ci-net \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD=postgres \
            -e POSTGRES_DB=dotmac_erp_ci \
            -e POSTGRES_HOST_AUTH_METHOD=trust \
            --health-cmd "pg_isready -U postgres" \
            --health-interval 5s \
            --health-retries 10 \
            postgres:16

      - name: Start Redis
        run: docker run -d --name ci-redis --network ci-net redis:7

      - name: Wait for PostgreSQL
        run: |
          for i in $(seq 1 30); do
            if docker exec ci-db pg_isready -U postgres > /dev/null 2>&1; then
              echo "PostgreSQL ready"
              break
            fi
            echo "Waiting for PostgreSQL... ($i/30)"
            sleep 2
          done

      # Same real deploy step as the integration job — see the comment there.
      # Runs in the app image because that is where `scripts/` lives.
      # The password goes in PGPASSWORD, not in the URL. libpq reads it either
      # way, and keeping credentials out of connection strings means they cannot
      # leak through a logged URL, a `ps` listing, or an error message that
      # echoes the DSN.
      - name: Bootstrap database roles (explicitly privileged)
        env:
          # Declared here, not inline in the `run:` block, so the value sits in
          # YAML where a reviewer (and the secret scanner) can see it annotated.
          # `docker run -e PGPASSWORD` with no `=` passes it through from this
          # environment rather than restating it on the command line, which also
          # keeps it out of the container's visible argv.
          PGPASSWORD: postgres  # pragma: allowlist secret
        run: |
          docker run --rm --name ci-role-bootstrap --network ci-net \
            -e BOOTSTRAP_DATABASE_URL=postgresql://postgres@ci-db:5432/dotmac_erp_ci \
            -e PGPASSWORD \
            dotmac-erp:ci \
            python scripts/bootstrap_database_roles.py

      - name: Assign the CI database to the migration executor
        run: >-
          docker exec ci-db psql -X -v ON_ERROR_STOP=1 -U postgres -d postgres
          -c "ALTER DATABASE dotmac_erp_ci OWNER TO app_admin"

      - name: Run database migrations
        run: |  # pragma: allowlist secret
          docker run --rm --name ci-migrate --network ci-net \
            -e DATABASE_URL=postgresql+psycopg://postgres:postgres@ci-db:5432/dotmac_erp_ci \
            -e MIGRATION_DATABASE_URL=postgresql+psycopg://app_admin@ci-db:5432/dotmac_erp_ci \
            -e SECRET_KEY=ci-test-secret-key-not-for-production \
            -e JWT_SECRET=ci-test-jwt-secret-key-minimum-32-bytes-long \
            -e TOTP_ENCRYPTION_KEY=QLUJktsTSfZEbST4R-37XmQ0tCkiVCBXZN2Zt053w8g= \
            -e REDIS_URL=redis://ci-redis:6379/0 \
            dotmac-erp:ci \
            alembic upgrade heads

      - name: Start application  # pragma: allowlist secret
        run: |  # pragma: allowlist secret
          docker run -d --name ci-app --network ci-net \
            -e DATABASE_URL=postgresql+psycopg://postgres:postgres@ci-db:5432/dotmac_erp_ci \
            -e SECRET_KEY=ci-test-secret-key-not-for-production \
            -e JWT_SECRET=ci-test-jwt-secret-key-minimum-32-bytes-long \
            -e TOTP_ENCRYPTION_KEY=QLUJktsTSfZEbST4R-37XmQ0tCkiVCBXZN2Zt053w8g= \
            -e REDIS_URL=redis://ci-redis:6379/0 \
            -e CELERY_BROKER_URL=redis://ci-redis:6379/0 \
            -e DOTMAC_DEV_MODE=true \
            -e GUNICORN_WORKERS=1 \
            dotmac-erp:ci \
            gunicorn -c gunicorn.conf.py app.main:app

      - name: Wait for health check
        run: |
          for i in $(seq 1 60); do
            STATUS=$(docker inspect --format='{{.State.Status}}' ci-app 2>/dev/null || echo "missing")
            if [ "$STATUS" = "exited" ]; then
              echo "Container exited unexpectedly!"
              docker logs ci-app
              exit 1
            fi
            HEALTH=$(docker exec ci-app python -c "import urllib.request; print(urllib.request.urlopen('http://localhost:8002/health').read().decode())" 2>/dev/null || echo "")
            if echo "$HEALTH" | grep -q '"ok"'; then
              echo "Health check passed: $HEALTH"
              exit 0
            fi
            echo "Waiting for app to be healthy... ($i/60)"
            sleep 3
          done
          echo "Health check timed out after 180 seconds"
          docker logs ci-app
          exit 1

      - name: Cleanup
        if: always()
        run: |
          docker rm -f ci-app ci-db ci-redis 2>/dev/null || true
          docker network rm ci-net 2>/dev/null || true

  # ---------------------------------------------------------------------------
  # Integration Tests — PostgreSQL
  # Runs tests/integration/ against a real PostgreSQL 16 service container.
  # Validates Alembic migrations and PostgreSQL-specific features.
  # Blocking: PostgreSQL-specific behavior is part of the product contract.
  # ---------------------------------------------------------------------------
  integration-test:
    name: Integration Tests (PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # No `continue-on-error`. Every PostgreSQL-only check lived behind it —
    # tenant isolation, the migration chain, and the RLS coverage ratchet — so
    # all of them reported and none of them gated: the suite could fail and the
    # merge went green anyway. A ratchet that cannot fail a build is an alarm
    # with the wire cut.
    # If this job becomes flaky, fix or narrowly quarantine the unstable test;
    # restoring this flag would silence every PostgreSQL check together.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres  # pragma: allowlist secret
          POSTGRES_DB: dotmac_erp_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: "postgresql+psycopg://postgres:postgres@localhost:5432/dotmac_erp_test"
      MIGRATION_DATABASE_URL: "postgresql+psycopg://app_admin@localhost:5432/dotmac_erp_test"
      TEST_DATABASE_URL: "postgresql+psycopg://postgres:postgres@localhost:5432/dotmac_erp_test"
      JWT_SECRET: "ci-integration-test-secret-key-minimum-32-bytes"  # pragma: allowlist secret
      TOTP_ENCRYPTION_KEY: "QLUJktsTSfZEbST4R-37XmQ0tCkiVCBXZN2Zt053w8g="  # pragma: allowlist secret
      REDIS_URL: "redis://localhost:6379/0"
    steps:
      - uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ env.PYTHON_VERSION }}-${{ hashFiles('poetry.lock') }}

      - name: Install dependencies
        run: poetry install --no-interaction

      # The role bootstrap is a REAL deploy step, so CI performs it exactly as an
      # operator would: elevated credentials, its own connection string, before
      # migrations. `20260814_database_roles` then verifies and fails closed, and
      # it cannot create the roles itself — an ordinary `alembic upgrade` runs as
      # unprivileged `app_admin`.
      #
      # Modelling it here is not scaffolding to make a test pass. If this step
      # were dropped, the migration chain would stop with the same error a real
      # deployment gets when the bootstrap is skipped, which is the point.
      - name: Bootstrap database roles (explicitly privileged)
        env:
          # libpq URL (no `+psycopg`), superuser, deliberately distinct from
          # DATABASE_URL so the elevation is visible in the job log. The password
          # goes in PGPASSWORD rather than the URL: libpq reads it either way,
          # and credentials outside the connection string cannot leak through a
          # logged URL, a `ps` listing, or an error that echoes the DSN.
          BOOTSTRAP_DATABASE_URL: "postgresql://postgres@localhost:5432/dotmac_erp_test"
          PGPASSWORD: postgres  # pragma: allowlist secret
        run: poetry run python scripts/bootstrap_database_roles.py

      - name: Assign the test database to the migration executor
        env:
          BOOTSTRAP_DATABASE_URL: "postgresql://postgres@localhost:5432/postgres"
          PGPASSWORD: postgres  # pragma: allowlist secret
        run: |
          poetry run python -c "import os, psycopg; connection = psycopg.connect(os.environ['BOOTSTRAP_DATABASE_URL'], autocommit=True); connection.execute('ALTER DATABASE dotmac_erp_test OWNER TO app_admin'); connection.close()"

      - name: Run Alembic migrations
        run: poetry run alembic upgrade heads

      # RLS is applied by point-in-time sweeps over information_schema, so
      # coverage cannot be derived from source — this is the only place the
      # number can be obtained. Prints unconditionally so the figure lands in
      # the log on green runs too.
      #
      # --enforce --baseline is a RATCHET, not a target: it fails only on a gap
      # that is not already recorded in docs/rls-coverage-baseline.json. A new
      # organization-scoped table without RLS fails here; the 224 pre-existing
      # ones do not, because failing 224 times on day one gets a gate switched
      # off rather than tables fixed. Fixing a table means deleting its line
      # from the baseline, and the audit prints which entries are now protected
      # so a fix cannot silently regress.
      - name: RLS coverage ratchet
        run: |
          poetry run python scripts/architecture/rls_coverage_audit.py \
            --enforce --baseline docs/rls-coverage-baseline.json

      - name: Run integration tests
        # -o addopts= clears pytest.ini's "-m not integration" filter
        # confcutdir prevents loading tests/conftest.py which monkey-patches
        # PostgreSQL UUID/JSONB types for SQLite compatibility
        # --timeout=120 prevents individual tests from hanging forever
        run: poetry run pytest tests/integration/ -v --tb=short --timeout=120 -o "addopts=" -o "confcutdir=tests/integration"

  # ---------------------------------------------------------------------------
  # Publish Docker Image to GHCR
  # Only runs on main branch after all checks pass.
  # Tags: latest, sha-<short>, date (YYYY-MM-DD)
  # ---------------------------------------------------------------------------
  publish-image:
    name: Publish Docker Image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [lint, type-check, test, docker-build, integration-test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short
            type=raw,value={{date 'YYYY-MM-DD'}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          secrets: |
            forgejo_token=${{ secrets.FORGEJO_READ_TOKEN }}
