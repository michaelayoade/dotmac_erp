name: Prepare exact KPI metadata repair
on:
  push:
    branches: [feature/people-kpi-dashboard-insights]
    paths: [.github/workflows/kpi-test-log-collection.yml]
permissions:
  contents: read
jobs:
  prepare:
    if: github.repository == 'michaelayoade/dotmac_erp' && github.ref == 'refs/heads/feature/people-kpi-dashboard-insights'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Apply hash-verified five-line metadata correction
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import ast
          import hashlib
          import json
          import runpy
          import tomllib
          from pathlib import Path
          edits = [
              {'path': 'deploy/product.toml', 'before': 'a46745ab9c481b187584ed63d8c246c1de95d2ec3f68a5c0cccf28030b436eee', 'after': 'a9e1d934eb11c7a4a45f69e10d1e877eb23388a78e6b72d35ed17e13d9fa5a47', 'replacements': [('    "20260914_technician_role",', '    "20260915_kpi_direction",')]},
              {'path': 'tests/migrations/test_people_employment_type_activation_migration.py', 'before': '2af2d513a5bffbc1b80410de9fd8d8748fcdc8336ea575e8755ffb69f28a9f64', 'after': '68aa4a04668d6362da85c91538f472f307b0570227eaaa57c381936d38d9d0b3', 'replacements': [('    assert heads == ["20260914_technician_role"], heads', '    assert heads == ["20260915_kpi_direction"], heads')]},
              {'path': 'docs/inventories/people-dependent-references.tsv', 'before': '6dab642ba9c9e69a0dbc67a52545804ef5803868af54d756f3ff233a9d112290', 'after': 'f3f90f1ea239c6d0b08648cd60d197fc6ea2a3375e4a8857d472097c52bfcfb1', 'replacements': [('app/models/people/perf/kpi.py:50 via app/models/people/base.py:61', 'app/models/people/perf/kpi.py:52 via app/models/people/base.py:61'), ('app/models/people/perf/kpi.py:82', 'app/models/people/perf/kpi.py:84'), ('app/models/people/perf/kpi.py:50 via app/models/people/base.py:66', 'app/models/people/perf/kpi.py:52 via app/models/people/base.py:66')]},
          ]
          for edit in edits:
              path = Path(edit['path'])
              raw = path.read_bytes()
              assert hashlib.sha256(raw).hexdigest() == edit['before'], path
              text = raw.decode('utf-8')
              for before, after in edit['replacements']:
                  assert text.count(before) == 1, (path, before)
                  text = text.replace(before, after)
              raw = text.encode('utf-8')
              assert hashlib.sha256(raw).hexdigest() == edit['after'], path
              path.write_bytes(raw)
          checks = runpy.run_path('tests/architecture/test_people_dependent_references.py')
          for name, check in checks.items():
              if name.startswith('test_'):
                  check()
                  print('PASS:', name)
          path = Path('tests/migrations/test_people_employment_type_activation_migration.py')
          tree = ast.parse(path.read_text())
          functions = [node for node in tree.body if isinstance(node, ast.FunctionDef) and node.name in {'_revision_parents', 'test_the_erp_lineage_stays_single_headed_after_this_activation'}]
          assert len(functions) == 2
          namespace = {'ast': ast, 'PROJECT_ROOT': Path.cwd()}
          exec(compile(ast.Module(body=functions, type_ignores=[]), str(path), 'exec'), namespace)
          namespace['test_the_erp_lineage_stays_single_headed_after_this_activation']()
          parents = namespace['_revision_parents']()
          assert parents['20260915_kpi_direction'] == ('20260914_technician_role',)
          print('PASS: exact ERP migration head across', len(parents), 'revisions')
          descriptor = tomllib.loads(Path('deploy/product.toml').read_text())
          assert set(descriptor['migration']['expected_heads']) == {'20260915_kpi_direction', 'fi_0002_selectable_planes', 'im_0001_import_runs', 'ac_0001_accounting', 'nu_0001_numbering', 'pe_0001_people_directory', 'tx_0003_result_fingerprint'}
          print('PASS: ERP descriptor head updated; all six module heads preserved')
          Path('/tmp/kpi-repair-manifest.json').write_text(json.dumps(edits))
          PY
          git diff --check
          git diff --stat
      - name: Prepare immutable commit objects only; do not update any branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          from pathlib import Path
          repo = 'repos/michaelayoade/dotmac_erp'
          def api(endpoint, payload):
              result = subprocess.run(['gh', 'api', '--method', 'POST', repo + endpoint, '--input', '-'], input=json.dumps(payload), text=True, capture_output=True, check=True)
              return json.loads(result.stdout)
          parent = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          assert parent == os.environ['GITHUB_SHA']
          base_tree = subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip()
          edits = json.loads(Path('/tmp/kpi-repair-manifest.json').read_text())
          allowed = {'deploy/product.toml', 'tests/migrations/test_people_employment_type_activation_migration.py', 'docs/inventories/people-dependent-references.tsv'}
          assert {item['path'] for item in edits} == allowed and len(edits) == 3
          entries = []
          for edit in edits:
              raw = Path(edit['path']).read_bytes()
              assert hashlib.sha256(raw).hexdigest() == edit['after']
              blob = api('/git/blobs', {'content': raw.decode('utf-8'), 'encoding': 'utf-8'})
              entries.append({'path': edit['path'], 'mode': '100644', 'type': 'blob', 'sha': blob['sha']})
          entries.append({'path': '.github/workflows/kpi-test-log-collection.yml', 'mode': '100644', 'type': 'blob', 'sha': None})
          tree = api('/git/trees', {'base_tree': base_tree, 'tree': entries})
          commit = api('/git/commits', {'message': 'fix(people): align KPI migration head and dependency evidence\n\nRepair the three exact failures in CI run 34981516832: update the\ndeployment descriptor and strict ERP-lineage head to 20260915_kpi_direction;\nrefresh three KPI foreign-key declaration source locations.\nKeep all checks, dependency identities, and module migration heads intact.\nRemove the temporary failure-log collection workflow.', 'tree': tree['sha'], 'parents': [parent]})
          print('PREPARED_REPAIR_COMMIT=' + commit['sha'])
          print('PREPARED_PARENT=' + parent)
          print('PREPARED_TREE=' + tree['sha'])
          print('No branch reference was changed. Review the exact diff before publishing.')
          PY
