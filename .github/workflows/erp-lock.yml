# Resolve ERP's two pending private-index repins — `dotmac-files` 0.1.0a2 ->
# 0.1.0a4 and `dotmac-tax` 0.1.0a3 -> 0.1.0a4 — against the private Forgejo
# index, and prove the bytes it names are the bytes the index actually
# publishes.
#
# This exists for exactly the reason `dotmac_vendor_control_plane`'s
# `kernel-lock.yml` exists: a lock entry for a privately-published
# distribution is the one part of a pin change that CANNOT be written by hand
# or resolved with a local `poetry lock` — a workstation cannot authenticate
# to the private index, and the alternatives (exposing registry credentials on
# a workstation, or hand-editing `poetry.lock`) are both refused. So
# resolution moves into this protected workflow, reusing that workflow's shape
# and reasoning — see `scripts/erp_lock.py`'s module docstring for the two
# places ERP's own manifest required a genuine adaptation rather than a copy.
#
# It is `workflow_dispatch` only. Nothing schedules it and no push triggers
# it: a lock move is an authored act.
#
# ── THE CREDENTIAL AND THE RESOLVER NEVER SHARE A JOB ────────────────────────
#
# Poetry can execute an sdist build backend during resolution when a
# candidate's packaged metadata is insufficient (GHSA-73h3-mf4w-8647). While
# that runs in the same job as `FORGEJO_READ_TOKEN`, the credential is in that
# code's reach: its environment, its `.netrc`, its process tree. No guard on
# the manifest closes that, because the executing code is a PUBLISHED
# package's, not the manifest's.
#
# The repair is structural:
#
#   acquire  — holds the credential. Downloads the private index's pages and
#              artifacts, validates every index-supplied link against an
#              approved origin and path prefix, records digests, and lays the
#              bytes out as a local PEP 503 index. Runs NO Poetry and NO
#              package code: curl, sha256, and writing HTML.
#   resolve  — holds NO secret, and asserts it holds none. Runs Poetry against
#              the acquired bundle, served over loopback. The private index is
#              unreachable from here by construction — there is no credential
#              to reach it with and no fallback that would ask for one.
#   attest   — holds the credential again, to scan the produced pair for it.
#              Runs no Poetry and no package code.
#
# ── AND THE RESOLVER IS NEVER HANDED SOMETHING IT MUST BUILD ─────────────────
#
# `resolve` still reaches public PyPI (the manifest's implicit PyPI source is
# not mirrored), so a release with no usable wheel could have its sdist
# backend executed there. The resolution is therefore WHEEL-ONLY:
# `acquire` refuses a private release offering no usable wheel; `resolve`
# refuses, BEFORE `poetry lock` runs, any package in the pre-resolution lock
# that offers none; and `resolve` runs the same check again over the lock that
# leaves. See `scripts/erp_lock.py::wheel_only_problems` for the exact
# mechanism this checks — a property of Poetry 2.4.1, not a Poetry setting.
#
# ── TWO CHECKOUTS PER JOB, AND WHY ──────────────────────────────────────────
#
# The ref under resolution supplies the MANIFEST TO RESOLVE. It must never
# supply THE CODE THAT RESOLVES. The workspace ROOT is `github.sha` — the
# commit that defines this workflow, an operator approved by dispatching it —
# and every script resolves from there. The ref under resolution is checked
# out BESIDE it, at `work/`, and is only ever read as data or resolved
# against by Poetry.
#
# Every checkout sets `persist-credentials: false`; `actions/checkout` writes
# the workflow token into `.git/config` by default, and on the UNTRUSTED
# checkout that token would sit inside a tree a resolution may reach.
#
# The reachability check below is defence in depth with a stated premise: it
# proves the commit is reachable from a branch of THIS repository, which
# excludes a fork pull request's head commit — and nothing more. A branch here
# can be attacker-authored, and a pin change IS a branch.

name: ERP lock

on:
  workflow_dispatch:
    inputs:
      ref:
        description: >-
          The EXACT commit SHA to resolve against. A branch name is refused —
          a branch moves, and a lock resolved against "whatever main was"
          names a tree nobody reviewed.
        required: true
        type: string
      dotmac_files_version:
        description: >-
          The dotmac-files version to move to. The only value this workflow
          accepts is 0.1.0a4 (moving from the currently declared 0.1.0a2);
          anything else is refused by name.
        required: true
        type: string
      dotmac_tax_version:
        description: >-
          The dotmac-tax version to move to. The only value this workflow
          accepts is 0.1.0a4 (moving from the currently declared 0.1.0a3);
          anything else is refused by name.
        required: true
        type: string

permissions:
  contents: read

env:
  # The loopback port the acquired bundle is served on during resolution.
  # Overridable, with a documented default, like every other environment
  # value in this repository.
  MIRROR_PORT: ${{ vars.ERP_LOCK_MIRROR_PORT || '8899' }}
  # Poetry 2.4.1 is what `requires-poetry` in pyproject.toml and CI's own
  # POETRY_VERSION already pin. ERP carries no hash-verified bootstrap for it
  # (unlike Platform's `.github/bootstrap/`) — this is a plain version pin,
  # not a hash-verified one; see the report for this gap named explicitly.
  POETRY_VERSION: "2.4.1"

jobs:
  # ── THE ONLY JOB THAT HOLDS THE CREDENTIAL WHILE FETCHING ─────────────────
  acquire:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse anything but an exact commit and the one allowed movement
        env:
          REF: ${{ inputs.ref }}
          FILES_VERSION: ${{ inputs.dotmac_files_version }}
          TAX_VERSION: ${{ inputs.dotmac_tax_version }}
        run: |
          set -euo pipefail
          # A 40-hex ref is the only input that cannot mean something
          # different tomorrow. `main`, a branch, a tag and a short SHA are
          # all refused by the same rule rather than by four special cases.
          if ! printf '%s' "${REF}" | grep -qE '^[0-9a-f]{40}$'; then
            echo "::error::ref must be a full 40-character commit SHA, got '${REF}'"
            exit 1
          fi
          if [ "${FILES_VERSION}" != "0.1.0a4" ]; then
            echo "::error::dotmac_files_version must be 0.1.0a4, got '${FILES_VERSION}'"
            exit 1
          fi
          if [ "${TAX_VERSION}" != "0.1.0a4" ]; then
            echo "::error::dotmac_tax_version must be 0.1.0a4, got '${TAX_VERSION}'"
            exit 1
          fi

      # THE TRUSTED CHECKOUT — the workspace root, and the only place a
      # script or the Poetry bootstrap may come from.
      - name: Check out the tooling from the commit that defines this workflow
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: The requested ref is reachable from a branch of this repository
        env:
          REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          # Defence in depth, with a stated premise. This excludes a commit
          # that exists in this repository's object store but is on no
          # branch — a fork pull request's head, which `actions/checkout`
          # will happily resolve by SHA. It does NOT establish that anyone
          # reviewed the commit: a branch here can be attacker-authored, and
          # the pin change this workflow serves arrives as one.
          git fetch --quiet --no-tags origin '+refs/heads/*:refs/remotes/origin/*'
          if ! git rev-parse --quiet --verify "${REF}^{commit}" > /dev/null; then
            echo "::error::${REF} is not present in this repository after fetching"
            echo "::error::every branch head. It is either not a commit here at all, or"
            echo "::error::reachable only as a pull-request head — neither is dispatchable."
            exit 1
          fi
          BRANCHES=$(git branch --remotes --contains "${REF}" --format='%(refname:short)')
          if [ -z "${BRANCHES}" ]; then
            echo "::error::${REF} is on no branch of this repository. A commit"
            echo "::error::reachable only as a pull-request head is not dispatchable here."
            exit 1
          fi
          echo "reachable from:"
          printf '  %s\n' ${BRANCHES}

      # THE UNTRUSTED CHECKOUT. Data, beside the tooling — never above it.
      - name: Check out the ref under resolution, beside the tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          path: work
          persist-credentials: false

      - name: The checkout is the commit that was asked for
        working-directory: work
        env:
          REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          ACTUAL=$(git rev-parse HEAD)
          if [ "${ACTUAL}" != "${REF}" ]; then
            echo "::error::checked out ${ACTUAL}, asked for ${REF}"
            exit 1
          fi

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Move both pins, and refuse a tree that would misdirect the credential
        env:
          FILES_VERSION: ${{ inputs.dotmac_files_version }}
          TAX_VERSION: ${{ inputs.dotmac_tax_version }}
        run: |
          set -euo pipefail
          # `set-versions` refuses unless the ref's OWN tree declares the
          # allowed OLD version of each package exactly once, BEFORE editing,
          # and lands on the allowed NEW version exactly once, AFTER editing.
          # `manifest-guard` then reads every dependency form Poetry and PEP
          # 621/735 accept and refuses `work/poetry.toml`, which would
          # configure the resolver.
          python scripts/erp_lock.py set-versions \
            --manifest work/pyproject.toml \
            --movement "dotmac-files=${FILES_VERSION}" \
            --movement "dotmac-tax=${TAX_VERSION}"
          python scripts/erp_lock.py manifest-guard \
            --manifest work/pyproject.toml --checkout work \
            --movement "dotmac-files=${FILES_VERSION}" \
            --movement "dotmac-tax=${TAX_VERSION}"

      - name: There is a credential to resolve with
        env:
          FORGEJO_CREDENTIAL: ${{ secrets.FORGEJO_READ_TOKEN }}
        run: |
          set -euo pipefail
          # Deliberately AFTER the manifest guard: no step holds the
          # credential until the untrusted manifest has been judged.
          if [ -z "${FORGEJO_CREDENTIAL:-}" ]; then
            echo "::error::FORGEJO_READ_TOKEN is unset or empty in this repository."
            echo "::error::Its owner is OpenBao secret/dotmac/forgejo/read-token#value;"
            echo "::error::this workflow consumes the projection, it does not fetch it."
            exit 1
          fi
          echo "the credential is present"

      - name: Download the closed bundle from the private index
        env:
          TOKEN: ${{ secrets.FORGEJO_READ_TOKEN }}
          FILES_VERSION: ${{ inputs.dotmac_files_version }}
          TAX_VERSION: ${{ inputs.dotmac_tax_version }}
        run: |
          set -euo pipefail
          # The netrc exists for the length of this ONE step. curl offers it
          # only to the machine named in it, never follows a redirect, and
          # every URL it is handed came out of `approved_artifact_url` —
          # https, the approved authority, under the approved path prefix.
          trap 'rm -f -- "${HOME}/.netrc"' EXIT HUP INT TERM
          umask 077
          : > "${HOME}/.netrc"
          chmod 600 "${HOME}/.netrc"
          printf 'machine %s login %s password %s\n' \
            "registry.dotmac.io" "ci-reader" "${TOKEN}" >> "${HOME}/.netrc"

          python scripts/erp_lock.py acquire \
            --manifest work/pyproject.toml \
            --lock work/poetry.lock \
            --movement "dotmac-files=${FILES_VERSION}" \
            --movement "dotmac-tax=${TAX_VERSION}" \
            --out /tmp/bundle

      - name: The bundle carries no credential out of this job
        env:
          FORGEJO_CREDENTIAL: ${{ secrets.FORGEJO_READ_TOKEN }}
        run: |
          set -euo pipefail
          # The bundle is package bytes, wheel-derived Requires-Dist and an
          # index page this module wrote. Neither should contain the
          # credential, and this is the last moment anything downstream is in
          # a job that can look for it.
          if grep -rqF -- "${FORGEJO_CREDENTIAL}" /tmp/bundle; then
            echo "::error::the credential appears in the bundle; refusing to upload it"
            exit 1
          fi
          echo "the bundle is clean"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: erp-lock-bundle-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/bundle
          retention-days: 1
          if-no-files-found: error

  # ── THE RESOLVER. NO SECRET IS REFERENCED ANYWHERE IN THIS JOB ────────────
  resolve:
    runs-on: ubuntu-latest
    needs: acquire
    steps:
      - name: Check out the tooling from the commit that defines this workflow
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Check out the ref under resolution, beside the tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          path: work
          persist-credentials: false

      - name: The checkout is the commit that was asked for
        working-directory: work
        env:
          REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          ACTUAL=$(git rev-parse HEAD)
          if [ "${ACTUAL}" != "${REF}" ]; then
            echo "::error::checked out ${ACTUAL}, asked for ${REF}"
            exit 1
          fi

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # The repository-prescribed Poetry — pinned above by an explicit env
      # value, not a hash-verified bootstrap; ERP has no `.github/bootstrap/`
      # equivalent to Platform's today. Resolved from the workspace root,
      # which is the TRUSTED checkout — see the header.
      - uses: snok/install-poetry@a783c322200f0519c7926aa6faa857c4e23e9263 # v1.4.2
        with:
          version: ${{ env.POETRY_VERSION }}
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Move both pins, and refuse a tree that would misdirect the credential
        env:
          FILES_VERSION: ${{ inputs.dotmac_files_version }}
          TAX_VERSION: ${{ inputs.dotmac_tax_version }}
        run: |
          set -euo pipefail
          # Re-derived here rather than carried from `acquire` as an
          # artifact: this job must not resolve a tree it has not itself
          # judged.
          python scripts/erp_lock.py set-versions \
            --manifest work/pyproject.toml \
            --movement "dotmac-files=${FILES_VERSION}" \
            --movement "dotmac-tax=${TAX_VERSION}"
          python scripts/erp_lock.py manifest-guard \
            --manifest work/pyproject.toml --checkout work \
            --movement "dotmac-files=${FILES_VERSION}" \
            --movement "dotmac-tax=${TAX_VERSION}"

      - name: This job holds no credential, and says so before it resolves
        run: |
          set -euo pipefail
          if env | grep -qiE '^(FORGEJO|POETRY_HTTP_BASIC|NETRC|TWINE)'; then
            echo "::error::a credential-shaped variable is set in the resolver job."
            echo "::error::Resolution runs package build backends; it may not hold one."
            env | grep -oiE '^(FORGEJO|POETRY_HTTP_BASIC|NETRC|TWINE)[A-Z_]*' || true
            exit 1
          fi
          if [ -e "${HOME}/.netrc" ]; then
            echo "::error::${HOME}/.netrc exists in the resolver job"
            exit 1
          fi
          echo "no credential is present in this job"

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: erp-lock-bundle-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/bundle

      - name: Serve the acquired bundle as the private index, read-only
        run: |
          set -euo pipefail
          # READ-ONLY INPUTS. Resolution runs build backends; the bytes they
          # were resolved from must not be rewritable by them.
          chmod -R a-w /tmp/bundle
          cp work/poetry.lock /tmp/poetry.lock.before
          nohup python -m http.server "${MIRROR_PORT}" --bind 127.0.0.1 \
            --directory /tmp/bundle > /tmp/mirror.log 2>&1 &
          for _ in $(seq 1 50); do
            if curl -sS -o /dev/null --fail \
              "http://127.0.0.1:${MIRROR_PORT}/simple/dotmac-files/"; then
              echo "the bundle is being served on 127.0.0.1:${MIRROR_PORT}"
              exit 0
            fi
            sleep 0.2
          done
          echo "::error::the local bundle index never came up"
          exit 1

      - name: Aim the private source at the bundle
        run: |
          set -euo pipefail
          # The private source now points at loopback. There is NO
          # authenticated online fallback: this job has no credential, so a
          # package missing from the bundle cannot be fetched from anywhere.
          python scripts/erp_lock.py mirror-manifest \
            --manifest work/pyproject.toml \
            --mirror-url "http://127.0.0.1:${MIRROR_PORT}/simple"

      - name: Nothing in this resolution would have to be built
        run: |
          set -euo pipefail
          # THE GATE, and its position is the point — run BEFORE `poetry
          # lock`, this prevents a build backend running; run after, it can
          # only report one that already ran.
          python scripts/erp_lock.py wheel-only \
            --lock /tmp/poetry.lock.before

      - name: Resolve both pins, with no way to ask for more
        working-directory: work
        env:
          POETRY_CONFIG_DIR: /tmp/poetry-config
          POETRY_DATA_DIR: /tmp/poetry-data
          POETRY_CACHE_DIR: /tmp/poetry-cache
        run: |
          set -euo pipefail
          poetry lock

      - name: Put the real index URL back, and let Poetry re-derive the hash
        run: |
          set -euo pipefail
          # `source` is one of the keys Poetry's content-hash covers, so the
          # hash the offline resolution wrote describes the MIRROR manifest.
          python scripts/erp_lock.py restore \
            --manifest work/pyproject.toml --lock work/poetry.lock \
            --mirror-url "http://127.0.0.1:${MIRROR_PORT}/simple"

      - name: The lock and the pyproject edit agree, in Poetry's own words
        working-directory: work
        env:
          POETRY_CONFIG_DIR: /tmp/poetry-config
          POETRY_DATA_DIR: /tmp/poetry-data
          POETRY_CACHE_DIR: /tmp/poetry-cache
        run: |
          set -euo pipefail
          poetry check --lock

      - name: Only the two named packages moved, and only version, files and dependencies
        run: |
          set -euo pipefail
          # The drift gate, and it is the WHOLE lock. Only `dotmac-files` and
          # `dotmac-tax` may differ, and only in `version`, `files` and
          # `dependencies` — everything else on either entry, and every field
          # of every other entry, is held to the same identity. `dependencies`
          # is permitted here because a version move can legitimately raise
          # the moved package's own floor on a transitive dependency; the NEXT
          # step is what bounds that permitted freedom.
          python scripts/erp_lock.py drift \
            --before /tmp/poetry.lock.before --after work/poetry.lock

      - name: The moved entries' dependencies match the wheel's own metadata
        run: |
          set -euo pipefail
          # BOUNDED, not exhaustive: this compares NAME sets between the
          # lock's [package.dependencies] and the acquired wheel's own
          # Requires-Dist, without needing any credential — see
          # scripts/erp_lock.py's "bounding dependencies" section for what
          # this does and does not establish. It is what stops `drift`'s
          # permitted `dependencies` freedom from being a blank cheque.
          python scripts/erp_lock.py wheel-dependencies \
            --lock work/poetry.lock --requires-dir /tmp/bundle/requires

      - name: And nothing in the resolved lock would have to be built either
        run: |
          set -euo pipefail
          python scripts/erp_lock.py wheel-only --lock work/poetry.lock

      - name: The lock's hashes are the bytes the index published
        env:
          FILES_VERSION: ${{ inputs.dotmac_files_version }}
          TAX_VERSION: ${{ inputs.dotmac_tax_version }}
        run: |
          set -euo pipefail
          python scripts/erp_lock.py verify \
            --lock work/poetry.lock \
            --digests /tmp/bundle/digests.json \
            --movement "dotmac-files=${FILES_VERSION}" \
            --movement "dotmac-tax=${TAX_VERSION}"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: erp-lock-pair-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            work/pyproject.toml
            work/poetry.lock
          retention-days: 1
          if-no-files-found: error

  # ── THE SCAN AND THE BINDING. NO POETRY, NO PACKAGE CODE ──────────────────
  attest:
    runs-on: ubuntu-latest
    needs: resolve
    steps:
      - name: Check out the tooling from the commit that defines this workflow
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: erp-lock-pair-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/pair

      - name: Assemble the evidence — the manifest and the lock, bound together
        env:
          FORGEJO_CREDENTIAL: ${{ secrets.FORGEJO_READ_TOKEN }}
          REF: ${{ inputs.ref }}
          FILES_VERSION: ${{ inputs.dotmac_files_version }}
          TAX_VERSION: ${{ inputs.dotmac_tax_version }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          # Every coordinate crosses as a shell variable, never as a
          # `${{ }}` interpolation into this script. Both inputs are
          # validated in the first job, but a sink whose safety rests on a
          # check elsewhere is a sink.
          #
          # No resolver log is collected — see scripts/erp_lock.py's module
          # docstring and kernel_lock.py's precedent for why a scanned-only
          # file is the wrong resolution of an incomplete-scan finding.
          python scripts/erp_lock.py evidence \
            --out /tmp/evidence \
            --manifest /tmp/pair/pyproject.toml \
            --lock /tmp/pair/poetry.lock \
            --coordinate "ref=${REF}" \
            --coordinate "dotmac_files_version=${FILES_VERSION}" \
            --coordinate "dotmac_tax_version=${TAX_VERSION}" \
            --coordinate "repository=${REPOSITORY}" \
            --coordinate "workflow_run=${RUN_ID}" \
            --coordinate "run_attempt=${RUN_ATTEMPT}" \
            --coordinate "resolved_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: erp-lock-${{ inputs.dotmac_files_version }}-${{ inputs.dotmac_tax_version }}
          path: /tmp/evidence
          if-no-files-found: error

      - name: Say plainly that nothing was committed
        run: |
          echo "Resolved and verified. NOTHING was committed and no pull request"
          echo "was opened: download the artifact and apply BOTH pyproject.toml and"
          echo "poetry.lock in the pull request that moves the pins, so one reviewer"
          echo "sees the lock and the manifest it describes together. coordinates.txt"
          echo "says how to verify the pair before you apply it."
