name: ERP log-review implementation

on:
  push:
    branches: [chore/erp-log-review-workspace]
    paths:
      - .github/workflows/erp-log-review-implement.yml
      - tools/erp_log_review_workspace.py
      - tools/erp_log_review_fixes/**

permissions:
  contents: write

concurrency:
  group: erp-log-review-implementation
  cancel-in-progress: false

env:
  DATABASE_URL: sqlite:///./test.db
  SECRET_KEY: ci-test-secret-key-not-for-production
  REDIS_URL: redis://localhost:6379/0
  POETRY_HTTP_BASIC_FORGEJO_USERNAME: ci-reader
  POETRY_HTTP_BASIC_FORGEJO_PASSWORD: ${{ secrets.FORGEJO_READ_TOKEN }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          path: workspace
      - uses: actions/checkout@v4
        with:
          ref: 25b319a04cf1b1909eae83c87988fe196e805349
          path: source
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: snok/install-poetry@a783c322200f0519c7926aa6faa857c4e23e9263
        with:
          version: '2.4.1'
          virtualenvs-create: true
          virtualenvs-in-project: true
      - uses: actions/cache@v4
        with:
          path: source/.venv
          key: erp-log-review-venv-${{ runner.os }}-3.12-${{ hashFiles('source/poetry.lock') }}
      - name: Install the repository's locked dependencies
        working-directory: source
        run: poetry install --no-interaction
      - name: Build and verify isolated fix branches
        working-directory: source
        run: |
          if [ -f ../workspace/tools/erp_log_review_workspace.py ]; then
            python ../workspace/tools/erp_log_review_workspace.py
          fi
