name: Deployment conformance

# Calls the Starter-owned reusable gate at an immutable source revision. The
# published `dotmac-deployment-foundation==0.2.0a1` tag peels to ac21c9ae; this
# later workflow-only revision fixes non-strict digest conformance without
# changing the released package bytes. A branch or tag is not admissible here.

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  deployment:
    uses: michaelayoade/dotmac_starter_mt/.github/workflows/deployment-conformance.yml@6a8fdb03d4e7594d3c943b338de0872a6f8c2457
    with:
      descriptor: deploy/product.toml
      rendered-dir: deploy/rendered
      thresholds: deploy/alerts/thresholds.json
      foundation-version: "0.2.0a1"
      # The assembly manifest is real. The image remains an explicit sentinel
      # until protected-main CI publishes the tested image and records its
      # registry digest; candidate/production cutover must turn this on.
      require-real-digests: false
    secrets:
      FORGEJO_READ_TOKEN: ${{ secrets.FORGEJO_READ_TOKEN }}
