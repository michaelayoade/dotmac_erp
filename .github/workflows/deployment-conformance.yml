name: Deployment conformance

# Calls the Starter-owned reusable gate at the immutable source revision for
# the published `dotmac-deployment-foundation==0.1.0a1` release. The annotated
# tag peels to this exact SHA; a branch or tag is not an admissible workflow pin.

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  deployment:
    uses: michaelayoade/dotmac_starter_mt/.github/workflows/deployment-conformance.yml@c072e1f51548dca04ab182d653d032bb481f4b79
    with:
      descriptor: deploy/product.toml
      rendered-dir: deploy/rendered
      thresholds: deploy/alerts/thresholds.json
      foundation-version: "0.1.0a1"
      # The assembly manifest is real. The image remains an explicit sentinel
      # until protected-main CI publishes the tested image and records its
      # registry digest; candidate/production cutover must turn this on.
      require-real-digests: false
    secrets:
      FORGEJO_READ_TOKEN: ${{ secrets.FORGEJO_READ_TOKEN }}
