name: Engineering standards

on:
  # `dev` is the promotion branch and `integration/**` carries multi-PR
  # adoption programmes (kernel migration). Without both, a pull request into
  # either runs no CI at all and the whole batch meets it for the first time
  # on the way to main.
  push:
    branches: [main, dev, 'integration/**']
  pull_request:
    branches: [main, dev, 'integration/**']
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  standards:
    name: Dotmac engineering standards
    runs-on: ubuntu-latest
    # Schema 9 derives test-only reachability before measuring connector
    # surface. Five minutes is below the accepted engine's measured runtime on
    # this repository and would turn a valid adoption into timeout noise.
    timeout-minutes: 10
    steps:
      - name: Check out the evaluated product revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Enforce the accepted Dotmac engineering standards
        uses: michaelayoade/dotmac_governance/.github/actions/standards-check@4f6fbf98c25f7cfbb3dacc4f3d2f5fd7e473f193
        with:
          default-branch: ${{ github.event.repository.default_branch }}
