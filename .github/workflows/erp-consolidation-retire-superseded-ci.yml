name: Retire superseded ERP consolidation CI

on:
  push:
    branches: [work/erp-consolidation-ci-repair-20260918]

permissions:
  contents: read

jobs:
  retire:
    if: github.repository == 'michaelayoade/dotmac_erp' && github.ref == 'refs/heads/work/erp-consolidation-ci-repair-20260918'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      actions: write
    steps:
      - name: Cancel only the exact superseded PR CI run after verifying its replacement
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          base = 'https://api.github.com/repos/michaelayoade/dotmac_erp/actions/runs/'
          headers = {
              'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
          }

          def read(run_id):
              request = urllib.request.Request(base + str(run_id), headers=headers)
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)

          old = read(35381160214)
          new = read(35381732919)
          for run in (old, new):
              if run['event'] != 'pull_request' or run['path'] != '.github/workflows/ci.yml':
                  raise SystemExit('Refusing to cancel a non-PR or non-CI workflow')
              if run['head_branch'] != 'consolidate/erp-open-prs-20260918':
                  raise SystemExit('Refusing to affect another branch')
          if old['head_sha'] != 'ddc56587bfe0638c3ed5740a3b3ff537a9639c5e':
              raise SystemExit('Unexpected superseded commit')
          if new['head_sha'] != '0e2aa7d8da674f150089bebfea55deee8754c0dc':
              raise SystemExit('Unexpected replacement commit')
          if new['status'] == 'completed' and new['conclusion'] != 'success':
              raise SystemExit('Replacement already failed; preserve old run for inspection')
          if old['status'] == 'completed':
              print('Superseded run already completed; no cancellation needed')
          else:
              request = urllib.request.Request(base + '35381160214/cancel', headers=headers, method='POST')
              with urllib.request.urlopen(request, timeout=30) as response:
                  if response.status != 202:
                      raise SystemExit('Unexpected cancellation response')
              print('Retired superseded run 35381160214; replacement 35381732919 remains enabled')
          PY
