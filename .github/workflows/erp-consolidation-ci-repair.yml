name: ERP consolidation isolated CI repair

on:
  push:
    branches: [work/erp-consolidation-ci-repair-20260918]

permissions:
  contents: read

jobs:
  generate:
    if: github.repository == 'michaelayoade/dotmac_erp' && github.ref == 'refs/heads/work/erp-consolidation-ci-repair-20260918'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      # The helper workflow is deliberately absent from the checked-out tree
      # and from the generated commit. Neither main nor the PR branch is pushed.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ddc56587bfe0638c3ed5740a3b3ff537a9639c5e
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: snok/install-poetry@a783c322200f0519c7926aa6faa857c4e23e9263
        with:
          version: '2.4.1'
          virtualenvs-create: true
          virtualenvs-in-project: true
      - name: Install the repository-locked development tools
        env:
          POETRY_HTTP_BASIC_FORGEJO_USERNAME: ci-reader
          POETRY_HTTP_BASIC_FORGEJO_PASSWORD: ${{ secrets.FORGEJO_READ_TOKEN }}
        run: poetry install --only dev --no-interaction
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'
          cache: npm
      - name: Verify all nine source heads are ancestors
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = ddc56587bfe0638c3ed5740a3b3ff537a9639c5e
          for sha in \
            71d9134d9ffe90ba9fd6d1b869a0bbde82ae88dc \
            cbb153b081bc8310d0ab10d0109cde3addc2c7ae \
            fc983616dd2e039efed8c0f1f8c0be8414e9812a \
            38788e465d6c86f43782a9d3aeb32aa9abd5306a \
            620c3aff59905623b8f572ef481fe393b5dd7eb4 \
            72fbb193c35312e5ac3d09892507e4196c30465b \
            11601b3fbf2fc511dc0a7f66e74df690af647b1c \
            40be0b0ff39ff1a9ca4ffeb046da1054ee82998b \
            cfe63d1a62d0582317be9f917b5731b825109784
          do
            git merge-base --is-ancestor "$sha" HEAD
            printf 'Retained source head: %s\n' "$sha"
          done
      - name: Apply the same formatter and stylesheet build as CI
        run: |
          make format
          make lint format-check
          python3 scripts/check_evidence_json.py
          python3 scripts/check_session_context.py
          npm ci --silent
          npm run build:css
      - name: Refuse semantic Python changes or unexpected file edits
        shell: bash
        run: |
          python3 - <<'PY'
          import ast
          import pathlib
          import subprocess

          allowed = {
              'app/services/inventory/purchase_report.py',
              'app/services/inventory/purchase_report_web.py',
              'app/web/inventory_weekly_purchases.py',
              'tests/test_inventory_purchase_report.py',
              'tests/test_inventory_purchase_report_web.py',
              'tests/test_inventory_weekly_purchases_registration.py',
              'static/css/app.css',
          }
          changed = set(subprocess.check_output(
              ['git', 'diff', '--name-only'], text=True
          ).splitlines())
          if changed != allowed:
              raise SystemExit(f'Unexpected changed-file set: {sorted(changed)}')
          for path in sorted(changed):
              if path.endswith('.py'):
                  before = subprocess.check_output(['git', 'show', f'HEAD:{path}'], text=True)
                  after = pathlib.Path(path).read_text()
                  before_ast = ast.dump(ast.parse(before, type_comments=True), include_attributes=False)
                  after_ast = ast.dump(ast.parse(after, type_comments=True), include_attributes=False)
                  if before_ast != after_ast:
                      raise SystemExit(f'Refusing a semantic Python change: {path}')
                  print(f'AST unchanged: {path}')
          subprocess.run(['git', 'diff', '--check'], check=True)
          subprocess.run(['git', 'diff', '--stat'], check=True)
          subprocess.run(['git', 'diff', '--', 'static/css/app.css'], check=True)
          PY
      - name: Confirm stylesheet rebuild is deterministic
        run: |
          sha256sum static/css/app.css > /tmp/erp-consolidation-css.sha256
          npm run build:css
          sha256sum --check /tmp/erp-consolidation-css.sha256
      - name: Publish only the verified generated repair commit to an output branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            app/services/inventory/purchase_report.py \
            app/services/inventory/purchase_report_web.py \
            app/web/inventory_weekly_purchases.py \
            tests/test_inventory_purchase_report.py \
            tests/test_inventory_purchase_report_web.py \
            tests/test_inventory_weekly_purchases_registration.py \
            static/css/app.css
          git commit -m 'style(erp): apply pinned formatting and regenerate consolidated stylesheet'
          test "$(git rev-parse HEAD^)" = ddc56587bfe0638c3ed5740a3b3ff537a9639c5e
          test -z "$(git diff HEAD^ HEAD -- .github/workflows)"
          git push origin HEAD:refs/heads/work/erp-consolidation-ci-output-20260918
          git log -1 --format='Verified repair commit: %H%nTree: %T%nParent: %P'
