name: Material final focused validation
on:
  push:
    branches: ['fix/selfcare-material-partial-issue']
    paths: ['.github/workflows/material-final-validation.yml']
permissions:
  contents: read
jobs:
  validate:
    if: github.repository == 'michaelayoade/dotmac_erp' && github.ref == 'refs/heads/fix/selfcare-material-partial-issue'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      DATABASE_URL: sqlite:///./test.db
      REDIS_URL: redis://127.0.0.1:9/0
      CELERY_BROKER_URL: memory://
      CELERY_RESULT_BACKEND: cache+memory://
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply exact reviewed event and fixture corrections
        id: apply
        run: |
          python - <<'PY'
          import ast, hashlib, pathlib
          hashes = {'tests/ifrs/inv/test_material_request_web_service.py': '050642fa987f5458e26c8d23051401253650c185', 'tests/sync/test_dotmac_sub_sync_service.py': '1d757c33660c48b8a8d1329a1e645f61ce09d059', 'app/services/inventory/material_request_web.py': 'da1c0b1214dd73a2acb0a4027eb617ddb04cf306'}
          texts = {}
          for name, wanted in hashes.items():
              data = pathlib.Path(name).read_bytes()
              assert hashlib.sha1(f'blob {len(data)}\0'.encode() + data).hexdigest() == wanted, name
              texts[name] = data.decode()
          def edit(name, function, old, new):
              text = texts[name]
              node = next(n for n in ast.walk(ast.parse(text)) if isinstance(n, ast.FunctionDef) and n.name == function)
              lines = text.splitlines(keepends=True)
              section = ''.join(lines[node.lineno-1:node.end_lineno])
              assert section.count(old) == 1, (function, old)
              lines[node.lineno-1:node.end_lineno] = [section.replace(old, new, 1)]
              texts[name] = ''.join(lines)
          web = 'tests/ifrs/inv/test_material_request_web_service.py'
          for fn in ('test_cancel_request_allows_unprocessed_states', 'test_cancel_request_rejects_processed_state', 'test_cancel_request_requires_reason_and_enforces_tenant'):
              edit(web, fn, '    db.get.return_value = request', '    request.items = []\n    request.source_system = "sub"\n    db.scalars.return_value.first.return_value = request\n    db.execute.return_value.all.return_value = []')
          edit(web, 'test_cancel_request_requires_reason_and_enforces_tenant', '    request.organization_id = uuid.uuid4()', '    statement = db.scalars.call_args.args[0]\n    assert organization_id in statement.compile().params.values()\n    assert "organization_id" in str(statement)\n    assert "FOR UPDATE" in str(statement)\n    db.scalars.return_value.first.return_value = None')
          edit(web, 'test_approve_request_allows_stock_ready_pending_issue_request', '    item.currency_code = "NGN"', '    item.currency_code = "NGN"\n    item.organization_id = organization_id\n    item.item_code = "ITEM001"\n    line.serial_numbers = []\n    line.out_of_stock = False')
          sync = 'tests/sync/test_dotmac_sub_sync_service.py'
          edit(sync, 'test_post_sub_issue_transaction_passes_selected_serials', '"line_id": uuid.uuid4()', '"line_id": line_id')
          edit(sync, 'test_post_sub_issue_transaction_passes_selected_serials', '        assert txn_input.serial_numbers == ["SN-001"]', '        assert txn_input.serial_numbers == ["SN-001"]\n        assert request_line.ordered_qty == Decimal("1")')
          edit('app/services/inventory/material_request_web.py', '_emit_sub_outcome', '        from app.services.sync.sub.procurement import _ProcurementMixin', '        # Date the authoritative change before building the cumulative snapshot.\n        request.updated_at = datetime.now(UTC)\n        db.flush()\n        from app.services.sync.sub.procurement import _ProcurementMixin')
          texts[web] += '''\n\ndef test_sub_outcome_flushes_current_source_time_before_hook() -> None:
              db = MagicMock()
              request = SimpleNamespace(source_system="sub", updated_at=None)
              def inspect_hook(**kwargs):
                  assert request.updated_at.tzinfo is not None
                  db.flush.assert_called_once()
                  assert kwargs["request"] is request
              with patch("app.services.sync.sub.procurement._ProcurementMixin._emit_sub_material_request_status_changed", side_effect=inspect_hook) as emit:
                  MaterialRequestWebService._emit_sub_outcome(db, uuid.uuid4(), request, MaterialRequestStatus.SUBMITTED, MaterialRequestStatus.ISSUED, uuid.uuid4())
              emit.assert_called_once()
              db.commit.assert_not_called()
          '''.replace('\n          ', '\n')
          for name, text in texts.items():
              ast.parse(text)
              pathlib.Path(name).write_text(text)
          PY
      - uses: snok/install-poetry@a783c322200f0519c7926aa6faa857c4e23e9263
        with:
          version: '2.4.1'
          virtualenvs-create: true
          virtualenvs-in-project: true
      - uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-3.12-${{ hashFiles('poetry.lock') }}
      - name: Install locked environment
        env:
          POETRY_HTTP_BASIC_FORGEJO_USERNAME: ci-reader
          POETRY_HTTP_BASIC_FORGEJO_PASSWORD: ${{ secrets.FORGEJO_READ_TOKEN }}
        run: poetry install --no-interaction
      - name: Pinned lint and format
        id: lint
        run: |
          poetry run ruff format app/services/inventory/material_request_web.py tests/ifrs/inv/test_material_request_web_service.py tests/sync/test_dotmac_sub_sync_service.py
          poetry run ruff check --fix app/services/inventory/material_request_web.py tests/ifrs/inv/test_material_request_web_service.py tests/sync/test_dotmac_sub_sync_service.py
      - name: Focused material regression suite
        id: tests
        continue-on-error: true
        run: |
          set -o pipefail
          poetry run pytest -q tests/ifrs/inv/test_selfcare_material_partial_issue.py tests/ifrs/inv/test_material_request_issue.py tests/ifrs/inv/test_material_request_web_service.py tests/ifrs/inv/test_material_request_approval_integrity.py tests/ifrs/inv/test_operations_inventory_web_service.py tests/sync/test_dotmac_sub_sync_service.py tests/architecture/test_openapi_contract_surface.py 2>&1 | tee "$RUNNER_TEMP/material-final-tests.txt"
      - name: Publish reviewed corrections and remove temporary workflow
        id: publish
        if: always() && steps.apply.outcome == 'success'
        run: |
          python - <<'PY'
          import os, pathlib, subprocess
          branch = 'fix/selfcare-material-partial-issue'
          assert os.environ['GITHUB_REF'] == 'refs/heads/' + branch
          names = ['app/services/inventory/material_request_web.py', 'tests/ifrs/inv/test_material_request_web_service.py', 'tests/sync/test_dotmac_sub_sync_service.py', '.github/workflows/material-final-validation.yml']
          pathlib.Path(names[-1]).unlink()
          dirty = set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines())
          assert dirty <= set(names)
          subprocess.run(['git', 'fetch', 'origin', branch], check=True)
          assert subprocess.check_output(['git', 'rev-parse', 'FETCH_HEAD'], text=True).strip() == os.environ['GITHUB_SHA']
          subprocess.run(['git', 'add', '--', *names], check=True)
          subprocess.run(['git', '-c', 'user.name=github-actions[bot]', '-c', 'user.email=41898282+github-actions[bot]@users.noreply.github.com', 'commit', '-m', 'fix(inventory): timestamp cumulative material outcomes and preserve locked regression coverage'], check=True)
          subprocess.run(['git', 'push', 'origin', 'HEAD:refs/heads/' + branch], check=True)
          subprocess.run(['git', 'rev-parse', 'HEAD'], check=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: material-final-validation
          path: ${{ runner.temp }}/material-final-tests.txt
          retention-days: 2
      - name: Require passing focused validation
        if: always()
        env:
          OK: ${{ steps.lint.outcome == 'success' && steps.tests.outcome == 'success' && steps.publish.outcome == 'success' }}
        run: test "$OK" = 'true'
