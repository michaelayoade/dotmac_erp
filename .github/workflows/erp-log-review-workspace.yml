name: ERP log-review workspace

on:
  push:
    branches: [chore/erp-log-review-workspace]

permissions:
  contents: read

jobs:
  export-source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 25b319a04cf1b1909eae83c87988fe196e805349
          persist-credentials: false
      - name: Export the reviewed source revision
        run: git archive --format=tar.gz --output="$RUNNER_TEMP/erp-source.tar.gz" HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: erp-log-review-source
          path: ${{ runner.temp }}/erp-source.tar.gz
          retention-days: 1
