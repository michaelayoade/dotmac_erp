name: Retire superseded ERP consolidation checks

on:
  push:
    branches: [work/erp-consolidation-ci-repair-20260918]

permissions:
  contents: read

jobs:
  retire:
    if: github.repository == 'michaelayoade/dotmac_erp' && github.ref == 'refs/heads/work/erp-consolidation-ci-repair-20260918'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    permissions:
      actions: write
      pull-requests: read
    steps:
      - name: Verify the replacement and cancel only the exact obsolete PR CI runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import time
          import urllib.request

          api = 'https://api.github.com/repos/michaelayoade/dotmac_erp/'
          headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'}
          def read(path):
              with urllib.request.urlopen(urllib.request.Request(api + path, headers=headers), timeout=30) as response:
                  return json.load(response)
          branch = 'consolidate/erp-open-prs-20260918'
          target = '906c6108b248b970939009d30a4ebb364559e72e'
          pr = read('pulls/596')
          assert pr['state'] == 'open' and pr['head']['ref'] == branch and pr['head']['sha'] == target
          replacements = []
          for _ in range(12):
              runs = read('actions/runs?head_sha=' + target + '&event=pull_request&per_page=100')['workflow_runs']
              replacements = [r for r in runs if r['head_branch'] == branch and r['path'] == '.github/workflows/ci.yml']
              if replacements:
                  break
              time.sleep(5)
          assert len(replacements) == 1, 'Require exactly one replacement CI run'
          replacement = replacements[0]
          assert replacement['status'] != 'completed' or replacement['conclusion'] == 'success'
          print('Replacement CI retained:', replacement['id'], target, replacement['status'])
          obsolete = {
              35385009065: '5914989f3ba4a3980d346b5511fc30cc50653083',
              35385963436: '64bf4a8c9c74a5b9b7040f95f8cb9f32307ef57a',
          }
          for run_id, sha in obsolete.items():
              run = read('actions/runs/' + str(run_id))
              assert run['head_sha'] == sha and run['head_branch'] == branch
              assert run['event'] == 'pull_request' and run['path'] == '.github/workflows/ci.yml'
              if run['status'] == 'completed':
                  print('Already completed:', run_id, run['conclusion'])
                  continue
              request = urllib.request.Request(api + f'actions/runs/{run_id}/cancel', headers=headers, method='POST')
              with urllib.request.urlopen(request, timeout=30) as response:
                  assert response.status == 202
              print('Canceled superseded CI:', run_id, sha)
          latest = read('actions/runs/' + str(replacement['id']))
          print('Current CI:', latest['id'], latest['head_sha'], latest['status'], latest['conclusion'])
          PY
