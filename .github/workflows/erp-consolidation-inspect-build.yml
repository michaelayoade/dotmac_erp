name: Inspect ERP consolidated unit-test failures

on:
  push:
    branches: [work/erp-consolidation-ci-repair-20260918]

permissions:
  contents: read
  actions: read

jobs:
  inspect:
    if: github.repository == 'michaelayoade/dotmac_erp' && github.ref == 'refs/heads/work/erp-consolidation-ci-repair-20260918'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Read exact completed test metadata and diagnostic excerpts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import collections
          import hashlib
          import json
          import os
          import re
          import urllib.error
          import urllib.parse
          import urllib.request

          api = 'https://api.github.com/repos/michaelayoade/dotmac_erp/'
          headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'}
          def read(path):
              with urllib.request.urlopen(urllib.request.Request(api + path, headers=headers), timeout=30) as response:
                  return json.load(response)
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, hdrs, newurl):
                  return None

          run = read('actions/runs/35381732919')
          assert run['head_sha'] == '0e2aa7d8da674f150089bebfea55deee8754c0dc'
          print(json.dumps({key: run[key] for key in ('id', 'head_sha', 'status', 'conclusion', 'run_attempt')}))
          jobs = read('actions/runs/35381732919/jobs?per_page=100&filter=latest')['jobs']
          print(json.dumps([{key: job[key] for key in ('id', 'name', 'head_sha', 'status', 'conclusion')} for job in jobs], indent=2))
          job = next(job for job in jobs if job['id'] == 105720225424)
          assert job['status'] == 'completed' and job['head_sha'] == run['head_sha']
          request = urllib.request.Request(api + 'actions/jobs/105720225424/logs', headers=headers)
          try:
              response = urllib.request.build_opener(NoRedirect()).open(request, timeout=30)
          except urllib.error.HTTPError as error:
              if error.code not in (301, 302, 303, 307, 308):
                  raise
              target = error.headers['Location']
              parsed = urllib.parse.urlparse(target)
              assert parsed.scheme == 'https'
              assert parsed.hostname.endswith(('.blob.core.windows.net', '.actions.githubusercontent.com', '.githubusercontent.com'))
              response = urllib.request.urlopen(target, timeout=30)
          with response:
              raw = response.read(50000000)
          print('Raw job log bytes:', len(raw), 'SHA256:', hashlib.sha256(raw).hexdigest())
          clean = re.sub(r'\x1b\[[0-9;]*m', '', raw.decode('utf-8-sig', errors='replace'))
          lines = [re.sub(r'^\d{4}-\d\d-\d\dT\S+Z ?', '', line) for line in clean.splitlines()]
          print('\n===== all failed test names and final test totals =====')
          for line in lines:
              if line.startswith(('FAILED ', 'ERROR ')) or re.search(r'\d+ failed,|\d+ passed,|short test summary', line):
                  print(line)
          errors = collections.Counter(line.strip() for line in lines if re.match(r'^E\s+', line))
          print('\n===== distinct repeated error lines =====')
          for line, count in errors.most_common(35):
              print(count, line)
          print('\n===== first three complete failure excerpts =====')
          indices = [i for i, line in enumerate(lines) if re.match(r'^_{3,} .* _{3,}$', line)]
          for n, start in enumerate(indices[:3]):
              end = indices[n + 1] if n + 1 < len(indices) else len(lines)
              block = lines[start:end]
              print('\n'.join(block[:70]))
              if len(block) > 70:
                  print('...')
                  print('\n'.join(block[-35:]))
          PY
