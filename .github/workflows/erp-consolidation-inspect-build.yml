name: Inspect remaining ERP integration failures

on:
  push:
    branches: [work/erp-consolidation-ci-repair-20260918]

permissions:
  contents: read
  actions: read

jobs:
  inspect:
    if: github.repository == 'michaelayoade/dotmac_erp' && github.ref == 'refs/heads/work/erp-consolidation-ci-repair-20260918'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Read bounded failure evidence from the exact completed jobs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import collections
          import json
          import os
          import re
          import urllib.error
          import urllib.parse
          import urllib.request

          api = 'https://api.github.com/repos/michaelayoade/dotmac_erp/'
          headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'}
          def read(path):
              with urllib.request.urlopen(urllib.request.Request(api + path, headers=headers), timeout=30) as response:
                  return json.load(response)
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, hdrs, newurl):
                  return None
          run = read('actions/runs/35385009065')
          assert run['head_sha'] == '5914989f3ba4a3980d346b5511fc30cc50653083'
          jobs = read('actions/runs/35385009065/jobs?per_page=100&filter=latest')['jobs']
          print(json.dumps([{k: j[k] for k in ('id','name','status','conclusion')} for j in jobs], indent=2))
          for job_id in (105729760978, 105729760458):
              job = next(j for j in jobs if j['id'] == job_id)
              assert job['status'] == 'completed'
              request = urllib.request.Request(api + f'actions/jobs/{job_id}/logs', headers=headers)
              try:
                  response = urllib.request.build_opener(NoRedirect()).open(request, timeout=30)
              except urllib.error.HTTPError as error:
                  if error.code not in (301,302,303,307,308):
                      raise
                  target = error.headers['Location']
                  parsed = urllib.parse.urlparse(target)
                  assert parsed.scheme == 'https' and parsed.hostname.endswith(('.blob.core.windows.net','.actions.githubusercontent.com','.githubusercontent.com'))
                  response = urllib.request.urlopen(target, timeout=30)
              with response:
                  raw = response.read(50000000).decode('utf-8-sig', errors='replace')
              raw = re.sub(r'\x1b\[[0-9;]*m', '', raw)
              lines = [re.sub(r'^\d{4}-\d\d-\d\dT\S+Z ?', '', line) for line in raw.splitlines()]
              print('\n===== JOB', job_id, job['name'], '=====')
              names = [line for line in lines if line.startswith(('FAILED ', 'ERROR '))]
              print('Failing case count:', len(names))
              print('\n'.join(names[:15]))
              print('Exception counts:', dict(collections.Counter(line.strip() for line in lines if re.match(r'^E\s+(?:\w+\.)*\w*(?:Error|Exception):', line)).most_common(8)))
              totals = [line for line in lines if re.search(r'\d+ failed|\d+ passed|\d+ errors', line) and not line.startswith('E ')]
              print('\n'.join(totals[-3:]))
              if job_id == 105729760978:
                  blocks = [i for i,line in enumerate(lines) if re.match(r'^_{3,} .* _{3,}$', line)]
                  for n,start in enumerate(blocks[:2]):
                      end = blocks[n+1] if n+1 < len(blocks) else min(start+120,len(lines))
                      block = lines[start:end]
                      print('\n===== FIRST FAILURE TRACE =====')
                      print('\n'.join(block[:35]))
                      if len(block)>35:
                          print('...')
                          print('\n'.join(block[-20:]))
          PY
