name: Verify ERP consolidation metadata and regression repairs

on:
  push:
    branches: [work/erp-consolidation-ci-repair-20260918]

permissions:
  contents: read

jobs:
  repair:
    if: github.repository == 'michaelayoade/dotmac_erp' && github.ref == 'refs/heads/work/erp-consolidation-ci-repair-20260918'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 5914989f3ba4a3980d346b5511fc30cc50653083
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: snok/install-poetry@a783c322200f0519c7926aa6faa857c4e23e9263
        with:
          version: '2.4.1'
          virtualenvs-create: true
          virtualenvs-in-project: true
      - name: Install locked application and test dependencies
        env:
          POETRY_HTTP_BASIC_FORGEJO_USERNAME: ci-reader
          POETRY_HTTP_BASIC_FORGEJO_PASSWORD: ${{ secrets.FORGEJO_READ_TOKEN }}
        run: poetry install --with dev --no-interaction
      - name: Apply bounded descriptor and regression expectation repairs
        run: |
          poetry run python - <<'PY'
          import csv
          import pathlib
          import re
          import subprocess
          import tomllib
          from tests.architecture import test_people_dependent_references as inventory

          assert subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip() == '5914989f3ba4a3980d346b5511fc30cc50653083'
          def replace_once(source, before, after):
              assert source.count(before) == 1, before
              return source.replace(before, after, 1)
          old_head = '20260915_merge_workforce_kpi'
          new_head = '20260918_push_delivery_outcomes'
          path = pathlib.Path('deploy/product.toml')
          source = path.read_text()
          before = tomllib.loads(source)
          source = replace_once(source, '"' + old_head + '"', '"' + new_head + '"')
          after = tomllib.loads(source)
          expected = tomllib.loads(path.read_text())
          assert old_head in expected['migration']['expected_heads']
          expected['migration']['expected_heads'] = [new_head if value == old_head else value for value in expected['migration']['expected_heads']]
          assert after == expected
          assert before['image'] == after['image'], 'Never change the deployed image identity'
          path.write_text(source)
          path = pathlib.Path('tests/migrations/test_people_employment_type_activation_migration.py')
          source = replace_once(path.read_text(), 'assert heads == ["' + old_head + '"], heads', 'assert heads == ["' + new_head + '"], heads')
          path.write_text(source)
          path = pathlib.Path('tests/tasks/test_push_delivery_outcomes.py')
          source = replace_once(path.read_text(), 'import pytest\n', 'import pytest\nfrom sqlalchemy.dialects import postgresql\n')
          source = replace_once(source, 'assert "SKIP LOCKED" in str(statements[-1])', 'assert "SKIP LOCKED" in str(\n        statements[-1].compile(dialect=postgresql.dialect())\n    )')
          path.write_text(source)

          actual = inventory._scan_models()
          recorded = inventory._load_inventory()
          assert actual.keys() == recorded.keys(), 'No dependency may be added or retired'
          changed = [identity for identity in actual if actual[identity] != recorded[identity]]
          assert 0 < len(changed) <= 10, changed
          for identity in changed:
              left, right = recorded[identity], actual[identity]
              assert {item.kind for item in left} == {item.kind for item in right}
              assert len(left) == len(right)
              old_lines = []
              new_lines = []
              for evidence, output in ((left, old_lines), (right, new_lines)):
                  for item in evidence:
                      match = re.fullmatch(r'app/models/notification\.py:(\d+)', item.path)
                      assert match and item.kind == 'explicit', (identity, item)
                      output.append(int(match.group(1)))
              assert sorted(new_lines) == [number + 10 for number in sorted(old_lines)]
              print('Line-only evidence repair:', identity, sorted(old_lines), '->', sorted(new_lines))
          with inventory.INVENTORY.open(newline='') as handle:
              rows = list(csv.DictReader(handle, delimiter='\t'))
          for row in rows:
              identity = inventory.ForeignKeyIdentity(*(row[key] for key in inventory.INVENTORY_FIELDS[:6]))
              if identity in changed:
                  row['declaration_paths'] = '|'.join(sorted({item.path for item in actual[identity]}))
          with inventory.INVENTORY.open('w', newline='') as handle:
              writer = csv.DictWriter(handle, fieldnames=inventory.INVENTORY_FIELDS, delimiter='\t', lineterminator='\n')
              writer.writeheader()
              writer.writerows(rows)
          assert inventory._load_inventory() == actual
          print('All dependency identities and declaration kinds preserved:', len(actual))
          PY
      - name: Format and verify the unchanged deployment render
        run: |
          poetry run ruff format tests/tasks/test_push_delivery_outcomes.py tests/migrations/test_people_employment_type_activation_migration.py
          poetry run ruff check tests/tasks/test_push_delivery_outcomes.py tests/migrations/test_people_employment_type_activation_migration.py
          poetry run dotmac-deploy -f deploy/product.toml validate
          poetry run dotmac-deploy -f deploy/product.toml render --thresholds deploy/alerts/thresholds.json --check -o deploy/rendered
          python3 scripts/check_evidence_json.py
      - name: Re-run all six previously failing unit cases plus their surrounding regression suites
        run: |
          poetry run pytest -q --timeout=60 \
            tests/architecture/test_deployment_descriptor.py \
            tests/architecture/test_people_dependent_references.py \
            tests/architecture/test_static_is_image_only.py \
            tests/migrations/test_people_employment_type_activation_migration.py \
            tests/tasks/test_push_delivery_outcomes.py \
            tests/test_postgresql_type_restoration_cache.py \
            tests/unit/test_postgresql_type_restoration.py
      - name: Publish only the four verified repair files to an output branch
        run: |
          python3 - <<'PY'
          import subprocess
          allowed = {'deploy/product.toml', 'docs/inventories/people-dependent-references.tsv', 'tests/migrations/test_people_employment_type_activation_migration.py', 'tests/tasks/test_push_delivery_outcomes.py'}
          changed = set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines())
          untracked = set(subprocess.check_output(['git', 'ls-files', '--others', '--exclude-standard'], text=True).splitlines())
          assert changed == allowed and not untracked, (changed, untracked)
          subprocess.run(['git', 'diff', '--check'], check=True)
          subprocess.run(['git', 'diff', '--', *sorted(allowed)], check=True)
          subprocess.run(['git', 'config', 'user.name', 'github-actions[bot]'], check=True)
          subprocess.run(['git', 'config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com'], check=True)
          subprocess.run(['git', 'add', '--', *sorted(allowed)], check=True)
          subprocess.run(['git', 'commit', '-m', 'fix(ci): align migration metadata and verify push locking with PostgreSQL dialect'], check=True)
          assert subprocess.check_output(['git', 'rev-parse', 'HEAD^'], text=True).strip() == '5914989f3ba4a3980d346b5511fc30cc50653083'
          subprocess.run(['git', 'push', 'origin', 'HEAD:refs/heads/work/erp-consolidation-metadata-output-20260918'], check=True)
          subprocess.run(['git', 'log', '-1', '--format=Verified repair commit: %H'], check=True)
          PY
