name: Inspect consolidated ERP raw CI logs

on:
  push:
    branches: [work/erp-consolidation-ci-repair-20260918]

permissions:
  contents: read
  actions: read

jobs:
  inspect:
    if: github.repository == 'michaelayoade/dotmac_erp' && github.ref == 'refs/heads/work/erp-consolidation-ci-repair-20260918'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Read exact run metadata and bounded diagnostic excerpts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import urllib.error
          import urllib.parse
          import urllib.request

          api = 'https://api.github.com/repos/michaelayoade/dotmac_erp/'
          headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'}

          def read(path):
              with urllib.request.urlopen(urllib.request.Request(api + path, headers=headers), timeout=30) as response:
                  return json.load(response)

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, hdrs, newurl):
                  return None

          run = read('actions/runs/35381732919')
          assert run['head_sha'] == '0e2aa7d8da674f150089bebfea55deee8754c0dc'
          print(json.dumps({key: run[key] for key in ('id', 'head_sha', 'status', 'conclusion', 'run_attempt')}))
          jobs = read('actions/runs/35381732919/jobs?per_page=100&filter=latest')['jobs']
          print(json.dumps([{key: job[key] for key in ('id', 'name', 'head_sha', 'status', 'conclusion')} for job in jobs], indent=2))
          for job in jobs:
              if job['id'] not in (105720225335, 105720225349) or job['status'] != 'completed':
                  continue
              assert job['head_sha'] == run['head_sha']
              print('\n===== RAW JOB', job['id'], job['name'], '=====')
              request = urllib.request.Request(api + 'actions/jobs/' + str(job['id']) + '/logs', headers=headers)
              try:
                  response = urllib.request.build_opener(NoRedirect()).open(request, timeout=30)
              except urllib.error.HTTPError as error:
                  if error.code not in (301, 302, 303, 307, 308):
                      raise
                  target = error.headers['Location']
                  parsed = urllib.parse.urlparse(target)
                  assert parsed.scheme == 'https'
                  assert parsed.hostname.endswith(('.blob.core.windows.net', '.actions.githubusercontent.com', '.githubusercontent.com'))
                  response = urllib.request.urlopen(target, timeout=30)
              with response:
                  text = response.read(30000000).decode('utf-8-sig', errors='replace')
              lines = text.splitlines()
              selected = set(range(min(8, len(lines))))
              selected.update(range(max(0, len(lines) - 90), len(lines)))
              pattern = r'FAILED |ERROR |E   |AssertionError|Error:|Traceback|InsufficientPrivilege|PoolTimeout|TimeoutError|FAILBUCKET|digest mismatch|static tree|checkout vs image|PermissionError|OperationalError|ProgrammingError|short test summary|tests/integration/test_dotmac_sub|0e2aa7d|ee4df8b'
              for index, line in enumerate(lines):
                  if re.search(pattern, line):
                      selected.update(range(max(0, index-3), min(len(lines), index+8)))
              for index in sorted(selected)[-600:]:
                  print(lines[index])
          PY
