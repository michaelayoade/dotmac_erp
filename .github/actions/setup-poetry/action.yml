name: Install pinned Poetry
description: >-
  Install a pinned, hash-locked Poetry without a third-party action. Drop-in
  replacement for snok/install-poetry@v1, which resolved from a MUTABLE tag and
  downloaded an installer from the public network on every job.

# Scope is deliberately identical to what it replaces: install Poetry and set
# the two virtualenv options. It does NOT run actions/setup-python — callers
# already do that explicitly, and may need to choose the version per job.
# Absorbing it here would hide that choice and duplicate a step that is
# already pinned by SHA.
#
# Ported from `dotmac_platform_control_plane`'s `.github/actions/setup-poetry`
# (that repo's `kernel-lock.yml` sibling workflow), which runs this on its own
# self-hosted runner fleet. ERP's workflows run only on GitHub-hosted
# `ubuntu-latest` runners (verified: no `runs-on:` in this repository names
# anything else) — ephemeral, not persistent — so the runner-specific claims
# below describe the SOURCE repository's environment, not one verified here.
# What DOES transfer unchanged is the mechanism: a mutable action tag/version
# range lets whoever controls it run arbitrary code in this workflow, and pip
# only hash-verifies archives it actually installs.
#
# Why this exists, in two parts:
#
# 1. Supply chain. `@v1` is a mutable tag: whoever controls it controls code
#    executing in this job. A local composite action has no external
#    reference that can move under it, and what it installs is pinned by
#    hash.
#
# 2. Reliability. The old action fetched install.python-poetry.org on every
#    run, putting runner egress in the critical path of every job. Platform's
#    own copy of this action was added after its equivalent workflow's runner
#    egress reset twice within one hour on 2026-08-04, both times before any
#    repository code ran — hash pinning secures CONTENTS but does not remove
#    cold-cache network dependence, so this adds a wheel cache and bounded
#    retries.
#
# The pinned version lives in .github/bootstrap/poetry-requirements.txt;
# regenerate it with .github/bootstrap/regenerate.sh.

runs:
  using: composite
  steps:
    # Cache pip's wheel cache, keyed on the lock file: a regenerated bootstrap
    # must MISS the cache, or a stale entry could quietly serve wheels the new
    # pin no longer names. (pip re-verifies hashes on install regardless, so
    # this is a latency optimisation, not a trust boundary.)
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/pip
        key: poetry-bootstrap-${{ runner.os }}-${{ hashFiles('.github/bootstrap/poetry-requirements.txt') }}

    - name: Install pinned Poetry into a fresh job-local venv
      shell: bash
      run: |
        set -euo pipefail
        req=".github/bootstrap/poetry-requirements.txt"
        venv="${RUNNER_TEMP}/poetry-bootstrap"

        # A FRESH VENV IS THE WHOLE POINT, not tidiness.
        #
        # pip leaves an already-satisfied requirement untouched, and hashes
        # protect archives being INSTALLED — not packages already on disk.
        # Installing into the interpreter's own site-packages therefore
        # verifies nothing whenever the packages happen to be present. On
        # Platform's persistent self-hosted runner that was every run after
        # the first: its `check` job reported every package "Requirement
        # already satisfied" from a shared tool cache and downloaded nothing,
        # so the bootstrap ran and established no trust at all, on precisely
        # the runner where a poisoned site-packages persists across jobs.
        # ERP's `ubuntu-latest` runners are ephemeral, so that specific decay
        # path is unverified here — but a fresh interpreter's own
        # `actions/setup-python` install can still pre-satisfy a transitive
        # dependency, and the same rule (verify what you actually install)
        # applies regardless of runner lifetime.
        #
        # Removing and recreating the venv makes skipping structurally
        # impossible: there is nothing there to satisfy anything, so every
        # package is fetched and hash-checked on every run.
        rm -rf "$venv"
        python -m venv "$venv"

        # Bounded retries for transient network faults. Every attempt applies
        # the SAME hash checking, so a mismatch fails all three identically —
        # retrying cannot launder a bad hash into an install. Bounded, because
        # retrying forever turns a real outage into a timeout with no
        # diagnosis; the final message names both causes so a genuine pin
        # failure is not misread as flakiness.
        for attempt in 1 2 3; do
          if "$venv/bin/python" -m pip install --disable-pip-version-check \
               --require-hashes --only-binary=:all: -r "$req"; then
            resolved="$("$venv/bin/poetry" --version)"
            echo "${venv}/bin" >> "$GITHUB_PATH"
            echo "installed ${resolved} at ${venv}/bin/poetry"
            "$venv/bin/poetry" config virtualenvs.create true
            "$venv/bin/poetry" config virtualenvs.in-project true
            exit 0
          fi
          echo "::warning::poetry bootstrap attempt ${attempt} failed"
          sleep $((attempt * 5))
        done
        echo "::error::poetry bootstrap failed after 3 attempts — if pip reported HASH MISMATCH this is NOT a network fault; regenerate ${req} with .github/bootstrap/regenerate.sh"
        exit 1

    - name: Assert Poetry is on PATH and importable by this job's python
      shell: bash
      run: |
        set -euo pipefail
        venv="${RUNNER_TEMP}/poetry-bootstrap"

        want_poetry="${venv}/bin/poetry"
        got_poetry="$(command -v poetry)"
        if [ "$got_poetry" != "$want_poetry" ]; then
          echo "::error::poetry on PATH is ${got_poetry}, not the hash-verified ${want_poetry} — a pre-existing install is shadowing the bootstrap"
          exit 1
        fi
        echo "poetry resolves to the verified venv: ${got_poetry}"

        # An executable on PATH is not the property this action exists to
        # guarantee — a caller that needs the poetry MODULE (see below) runs
        # plain `python`, not `poetry`, so `python` itself must resolve inside
        # this same venv or it will import nothing.
        want_python="${venv}/bin/python"
        got_python="$(command -v python)"
        if [ "$got_python" != "$want_python" ]; then
          echo "::error::python on PATH is ${got_python}, not the hash-verified ${want_python} — a caller running plain 'python' would not get a Poetry-capable interpreter, which is the exact failure mode this action exists to prevent (an executable-only Poetry install left 'poetry' on PATH but 'python' unable to import it: run 34754807594 failed with 'No module named poetry' because the lock scripts ask Poetry's own Locker for the content hash, which needs the module, not just the binary)"
          exit 1
        fi
        echo "python resolves to the verified venv: ${got_python}"

        # The exact submodule the lock scripts import, not just top-level
        # `poetry` — a top-level import can succeed while a submodule is
        # unavailable (e.g. a partial/corrupt install), which is the same
        # class of gap as the executable-only install this action replaces.
        if ! "$got_python" -c "import poetry.packages.locker"; then
          echo "::error::python -c 'import poetry.packages.locker' failed — the lock scripts (scripts/erp_lock.py) ask Poetry's own Locker for the content hash instead of reimplementing it, so this exact submodule must be importable from this job's python, not merely present as a 'poetry' executable on PATH"
          exit 1
        fi
        echo "poetry.packages.locker is importable from ${got_python}"
