# The ERP ADR number register — the allocator, not a summary of one.
#
# ERP allocated ADR numbers by looking at `docs/adr/` and taking the next free
# one. That is a read-then-write with no lock, performed on branches that
# cannot see each other, and it produced exactly the race it looks like:
# 0003, 0004, 0006 and 0008 each name more than one decision today. This file
# replaces that with a serialized allocator.
#
# HOW TO CLAIM A NUMBER
#
#   1. Run `python tools/adr/allocate.py --slug <your-slug>`. It takes
#      `next_free`, appends the row and raises the scalar, and refuses if the
#      number is taken, the slug is spent, a document already exists, or your
#      worktree carries anything else. Steps 1 and 2 by hand are still correct
#      and still checked; the tool exists so they are not done from memory.
#   2. (By hand, if you must: append a `[[reservation]]` row with
#      `status = "reserved"`, and raise `next_free` by one.)
#   3. Commit THAT ALONE, and land it on `main` before you write the ADR.
#   4. Write the ADR in a later change, and flip your row to
#      `status = "authored"` in the same change.
#
# WHY IT SERIALIZES
#
# `next_free` is one scalar on one line. Two branches that both allocate must
# both rewrite it, so git cannot silently auto-merge them — it raises a
# conflict, and a conflict is the lock being contended rather than a duplicate
# being created. Appended rows alone would not be enough: git will often merge
# two appends at the end of a file without complaint, and that is precisely how
# 0008 came to name two decisions.
#
# Step 3 is the load-bearing one. A number claimed in the same change that
# authors the ADR is claimed on a branch, and a claim on a branch is not a
# claim — it is what every colliding record here already did.
#
# PERMANENCE
#
# A number, once in this file, is never removed, reused, or reassigned to a
# different decision. An abandoned ADR takes `status = "withdrawn"` and keeps
# its number forever. Reuse is not a tidy-up: the number appears in commit
# messages, review threads, `pytest.raises(match="ADR-00NN")` assertions and
# other repositories' pins, and none of those are updated by deleting a row.
# A withdrawn record may be re-authored under a NEW number, declaring
# `replaces = <old number>` so the trail survives.
#
# STATUS VALUES
#
#   reserved   number claimed, ADR not yet written. No file may exist.
#   authored   `NNNN-<slug>.md` exists in this directory.
#   withdrawn  abandoned. The number is spent forever. No file may exist.
# THE THREE DATE-FREE FIELDS, AND WHY THEY ARE SEPARATE
#
#   claimed     ONE meaning, always: the git AUTHOR date of the commit that
#               claimed the number. It is never a merge time. A row whose
#               `claimed` matches no author date in this repository is wrong
#               and gets corrected; row 2 was, on 2026-09-05.
#   landed_at   Optional, and present only when the ADR is on protected
#               `main`. Derived from `main`'s FIRST-PARENT history, which is
#               the only history that says a change landed rather than merely
#               existed. Off-`main` rows have no `landed_at` and never will
#               until they land -- that absence is the point.
#   visibility  Present on every row that is NOT on `main`. One of:
#                 pr          reachable through an open or merged pull
#                             request -- anyone can audit it;
#                 remote_ref  pushed to `origin` but carries no pull request;
#                 local_only  exists on ONE WORKSTATION and nowhere else.
#   coordinate  The claimant's strongest IMMUTABLE coordinate: a blob SHA and
#               the ref carrying it, plus the pull request when there is one.
#               A branch name alone is not a coordinate -- it moves.
#
# WHY VISIBILITY IS RECORDED RATHER THAN AVERAGED AWAY
#
# A local-only claim cannot support a remotely auditable count. Saying "0006
# has five divergent contents" reads as a fact anyone can check; it is not.
# Two of those five are on `origin` and THREE EXIST ONLY ON ONE WORKSTATION,
# with no rescue ref published. If that machine is lost, the register's count
# becomes unverifiable and the material is gone. The honest form is to label
# each claimant with what an outside reviewer can actually reach. Publishing a
# non-merge rescue ref would change these labels, and requires its own
# authorization -- it has not been done.
#
# WHY THE BLOBS CARRY `pragma: allowlist secret`
#
# `detect-secrets` reads a 40-character hex string as a possible credential and
# is right to, in general. A git blob name is the opposite of a credential: it
# is a CONTENT ADDRESS, derived from the bytes it names, disclosing nothing that
# the object does not already disclose to whoever can read the object. Its whole
# purpose here is to be public and immutable, because a branch name moves and a
# blob does not.
#
# The pragma is a suppression, so it states its premise rather than silencing:
# every value under a `blob` key is a git object name and nothing else. Nothing
# else in this file may carry the pragma.
#
# WHAT NO CHECK HERE VERIFIES, declared rather than called coverage
#
# That each blob RESOLVES. `git cat-file -e` would answer it, and cannot be run
# in CI: a pull-request checkout carries this branch, not the nine other refs
# these blobs live on, and four of the claimants are on branches that were never
# pushed at all. A `local_only` coordinate is, by construction, unverifiable by
# anyone but the workstation holding it — that is what the label means, and a
# test asserting otherwise would fail for environmental reasons and teach
# nothing. This is an unmonitored region with a named cause, not an exemption.
#
# A DOCUMENT'S SELF-DECLARED DATE IS NOT AN AUTHOR DATE
#
# The archived 0003 and 0004 claimants both print `**Date:** 2026-08-17` in
# their own front matter, and were authored in git on 2026-08-26. The register
# records the git date and names the other as the document's own claim. This
# is the same conflation that made row 2 wrong: two different dates in one
# column reads as one meaning and is two.
#
#   contested  PRE-EXISTING DEBT ONLY. More than one decision already claims
#              this number, on branches that are not merged. No file may exist
#              on `main`, which is what stops a colliding branch merging: the
#              moment its file arrives, `authored` and the register disagree
#              and CI fails. Reconciling the claim is how the branch merges.
#              No new `contested` row may ever be added.

next_free = 13

