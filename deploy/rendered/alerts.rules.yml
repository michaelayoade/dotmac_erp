# GENERATED by dotmac-deployment-foundation. Do not edit; edit
# deploy/product.toml and re-run `dotmac-deploy render`.
# product dotmac_erp
#
# Every signal this fires against is already scoped by the resource
# attributes the platform stamps at collection time
# (service.name, deployment.environment, dotmac.product, dotmac.deployment_id, dotmac.release, dotmac.git_sha, dotmac.image_digest, dotmac.host, dotmac.role — see
# dotmac_deployment_foundation.telemetry.RESOURCE_ATTRIBUTES), so the
# foundation expressions below are NOT rewritten with a per-product
# PromQL label selector; splicing one into an arbitrary hand-authored
# expression is error-prone and untestable. The `product` label on
# every rule below is what a dashboard or alert router groups on
# instead.

groups:
  - name: "dotmac_foundation"
    rules:
      - alert: "FDN_HTTP_5XX_RATE_HIGH"
        expr: "sum(rate(http_requests_total{status=~\"5..\"}[5m])) by (service,instance) / sum(rate(http_requests_total[5m])) by (service,instance) > 0.02"
        for: "600s"
        labels:
          severity: "ticket"
          owner: "foundation"
          product: "dotmac_erp"
        annotations:
          summary: "HTTP availability SLO"
          runbook: "#http-5xx-rate"
          recovery: "ratio below threshold for 2 consecutive windows"
          protects: "HTTP availability SLO"
          dedup_by: "service,instance"
      - alert: "FDN_HTTP_5XX_RATE_CRITICAL"
        expr: "sum(rate(http_requests_total{status=~\"5..\"}[5m])) by (service,instance) / sum(rate(http_requests_total[5m])) by (service,instance) > 0.05"
        for: "300s"
        labels:
          severity: "page"
          owner: "foundation"
          product: "dotmac_erp"
        annotations:
          summary: "HTTP availability SLO"
          runbook: "#http-5xx-rate"
          recovery: "ratio below threshold for 2 consecutive windows"
          protects: "HTTP availability SLO"
          dedup_by: "service,instance"
      - alert: "FDN_HTTP_LATENCY_P99_HIGH"
        expr: "histogram_quantile(0.99, sum(rate(http_request_duration_seconds_bucket[5m])) by (le,service,instance)) > 2.0"
        for: "600s"
        labels:
          severity: "ticket"
          owner: "foundation"
          product: "dotmac_erp"
        annotations:
          summary: "request-latency SLO"
          runbook: "#http-latency-p99"
          recovery: "p99 under threshold for 10m"
          protects: "request-latency SLO"
          dedup_by: "service,instance"
      - alert: "FDN_HTTP_TRAFFIC_DROP"
        expr: "sum(rate(http_requests_total[5m])) by (service) < sum(rate(http_requests_total[5m] offset 1d)) by (service) * 0.5"
        for: "600s"
        labels:
          severity: "ticket"
          owner: "foundation"
          product: "dotmac_erp"
        annotations:
          summary: "silent routing/ingress failure detection"
          runbook: "#http-traffic-drop"
          recovery: "traffic back to baseline ratio"
          protects: "silent routing/ingress failure detection"
          dedup_by: "service"
      - alert: "FDN_READINESS_FAILING"
        expr: "probe_success{probe=\"readiness\"} == 0"
        for: "120s"
        labels:
          severity: "page"
          owner: "foundation"
          product: "dotmac_erp"
        annotations:
          summary: "traffic-cutover safety invariant"
          runbook: "#readiness-failing"
          recovery: "3 consecutive successful probes"
          protects: "traffic-cutover safety invariant"
          dedup_by: "service,instance"
      - alert: "FDN_LIVENESS_FAILING"
        expr: "probe_success{probe=\"liveness\"} == 0"
        for: "120s"
        labels:
          severity: "page"
          owner: "foundation"
          product: "dotmac_erp"
        annotations:
          summary: "crash-loop prevention"
          runbook: "#liveness-failing"
          recovery: "3 consecutive successful probes"
          protects: "crash-loop prevention"
          dedup_by: "service,instance"
      - alert: "FDN_CONTAINER_RESTART_LOOP"
        expr: "increase(container_restarts_total[10m]) > 3"
        for: "0s"
        labels:
          severity: "page"
          owner: "foundation"
          product: "dotmac_erp"
        annotations:
          summary: "crash-loop detection"
          runbook: "#restart-loop"
          recovery: "0 restarts for 10m"
          protects: "crash-loop detection"
          dedup_by: "container"
      - alert: "FDN_CONTAINER_OOM_KILLED"
        expr: "increase(container_oom_events_total[5m]) > 0"
        for: "0s"
        labels:
          severity: "page"
          owner: "foundation"
          product: "dotmac_erp"
        annotations:
          summary: "memory-limit correctness"
          runbook: "#oom-kill"
          recovery: "manual ack (limit is a config decision)"
          protects: "memory-limit correctness"
          dedup_by: "container"
      - alert: "FDN_CONTAINER_EXITED_UNEXPECTEDLY"
        expr: "container_last_seen < time() - 60 and container_exit_code != 0"
        for: "60s"
        labels:
          severity: "ticket"
          owner: "foundation"
          product: "dotmac_erp"
        annotations:
          summary: "unplanned-exit detection"
          runbook: "#container-exited"
          recovery: "container reports running with exit_code absent"
          protects: "unplanned-exit detection"
          dedup_by: "container"
      - alert: "FDN_CONTAINER_CPU_SATURATION"
        expr: "rate(container_cpu_usage_seconds_total[5m]) / container_spec_cpu_quota > 0.85"
        for: "600s"
        labels:
          severity: "ticket"
          owner: "foundation"
          product: "dotmac_erp"
        annotations:
          summary: "capacity headroom"
          runbook: "#container-cpu-saturation"
          recovery: "ratio below threshold for 10m"
          protects: "capacity headroom"
          dedup_by: "container"
      - alert: "FDN_CONTAINER_MEMORY_SATURATION"
        expr: "container_memory_working_set_bytes / container_spec_memory_limit_bytes > 0.85"
        for: "600s"
        labels:
          severity: "ticket"
          owner: "foundation"
          product: "dotmac_erp"
        annotations:
          summary: "OOM-kill prevention"
          runbook: "#container-memory-saturation"
          recovery: "ratio below threshold for 10m"
          protects: "OOM-kill prevention"
          dedup_by: "container"
      - alert: "FDN_HOST_CPU_SATURATION"
        expr: "1 - avg(rate(node_cpu_seconds_total{mode=\"idle\"}[5m])) by (host) > 0.90"
        for: "900s"
        labels:
          severity: "ticket"
          owner: "foundation"
          product: "dotmac_erp"
        annotations:
          summary: "host capacity headroom"
          runbook: "#host-cpu-saturation"
          recovery: "ratio below threshold for 15m"
          protects: "host capacity headroom"
          dedup_by: "host"
      - alert: "FDN_HOST_MEMORY_SATURATION"
        expr: "1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) > 0.90"
        for: "600s"
        labels:
          severity: "ticket"
          owner: "foundation"
          product: "dotmac_erp"
        annotations:
          summary: "host OOM prevention"
          runbook: "#host-memory-saturation"
          recovery: "ratio below threshold for 10m"
          protects: "host OOM prevention"
          dedup_by: "host"
      - alert: "FDN_HOST_DISK_LOW"
        expr: "node_filesystem_avail_bytes / node_filesystem_size_bytes < 0.15"
        for: "900s"
        labels:
          severity: "ticket"
          owner: "foundation"
          product: "dotmac_erp"
        annotations:
          summary: "disk exhaustion"
          runbook: "#disk-low"
          recovery: "free > threshold + hysteresis"
          protects: "disk exhaustion"
          dedup_by: "host,mount"
      - alert: "FDN_HOST_DISK_CRITICAL"
        expr: "node_filesystem_avail_bytes / node_filesystem_size_bytes < 0.05"
        for: "300s"
        labels:
          severity: "page"
          owner: "foundation"
          product: "dotmac_erp"
        annotations:
          summary: "disk exhaustion"
          runbook: "#disk-low"
          recovery: "free > threshold + hysteresis"
          protects: "disk exhaustion"
          dedup_by: "host,mount"
      - alert: "FDN_HOST_INODES_LOW"
        expr: "node_filesystem_files_free / node_filesystem_files < 0.15"
        for: "900s"
        labels:
          severity: "ticket"
          owner: "foundation"
          product: "dotmac_erp"
        annotations:
          summary: "inode exhaustion"
          runbook: "#inode-low"
          recovery: "free > threshold"
          protects: "inode exhaustion"
          dedup_by: "host,mount"
      - alert: "FDN_HOST_CLOCK_SKEW"
        expr: "abs(node_timex_offset_seconds) > 0.5"
        for: "600s"
        labels:
          severity: "ticket"
          owner: "foundation"
          product: "dotmac_erp"
        annotations:
          summary: "audit-timestamp/TLS validation correctness"
          runbook: "#clock-drift"
          recovery: "offset under threshold"
          protects: "audit-timestamp/TLS validation correctness"
          dedup_by: "host"
      - alert: "FDN_PG_DOWN"
        expr: "pg_up == 0"
        for: "60s"
        labels:
          severity: "page"
          owner: "foundation"
          product: "dotmac_erp"
        annotations:
          summary: "data-plane availability"
          runbook: "#postgres-down"
          recovery: "pg_up == 1 for 2m"
          protects: "data-plane availability"
          dedup_by: "instance"
      - alert: "FDN_PG_POOL_SATURATION"
        expr: "pg_stat_activity_count / pg_settings_max_connections > 0.80"
        for: "300s"
        labels:
          severity: "ticket"
          owner: "foundation"
          product: "dotmac_erp"
        annotations:
          summary: "request-serving capacity"
          runbook: "#pg-pool-exhausted"
          recovery: "ratio below 80%"
          protects: "request-serving capacity"
          dedup_by: "instance"
      - alert: "FDN_PG_LOCK_WAIT_HIGH"
        expr: "max(pg_locks_wait_seconds) by (instance) > 30"
        for: "300s"
        labels:
          severity: "ticket"
          owner: "foundation"
          product: "dotmac_erp"
        annotations:
          summary: "latency-cascade prevention"
          runbook: "#pg-long-lock"
          recovery: "resolved lock, no wait above threshold"
          protects: "latency-cascade prevention"
          dedup_by: "instance,relation"
      - alert: "FDN_PG_LONG_TRANSACTION"
        expr: "max(pg_stat_activity_max_tx_duration_seconds) by (instance) > 300"
        for: "300s"
        labels:
          severity: "ticket"
          owner: "foundation"
          product: "dotmac_erp"
        annotations:
          summary: "bloat/lock-contention prevention"
          runbook: "#pg-long-transaction"
          recovery: "duration under threshold"
          protects: "bloat/lock-contention prevention"
          dedup_by: "instance"
      - alert: "FDN_PG_REPLICATION_LAG_HIGH"
        expr: "pg_replication_lag_seconds > 60"
        for: "300s"
        labels:
          severity: "page"
          owner: "foundation"
          product: "dotmac_erp"
        annotations:
          summary: "DR/read-replica correctness"
          runbook: "#pg-replication-lag"
          recovery: "lag under threshold"
          protects: "DR/read-replica correctness"
          dedup_by: "instance"
      - alert: "FDN_PG_DISK_LOW"
        expr: "node_filesystem_avail_bytes{mountpoint=\"/var/lib/postgresql/data\"} / node_filesystem_size_bytes{mountpoint=\"/var/lib/postgresql/data\"} < 0.10"
        for: "600s"
        labels:
          severity: "page"
          owner: "foundation"
          product: "dotmac_erp"
        annotations:
          summary: "data-plane disk exhaustion"
          runbook: "#pg-disk-low"
          recovery: "free > threshold"
          protects: "data-plane disk exhaustion"
          dedup_by: "instance"
      - alert: "FDN_PG_MIGRATION_HEAD_DRIFT"
        expr: "pg_alembic_version_info != on() product_expected_migration_head"
        for: "300s"
        labels:
          severity: "page"
          owner: "foundation"
          product: "dotmac_erp"
        annotations:
          summary: "deploy correctness"
          runbook: "#migration-head-drift"
          recovery: "heads match"
          protects: "deploy correctness"
          dedup_by: "instance"
      - alert: "FDN_REDIS_DOWN"
        expr: "redis_up == 0"
        for: "60s"
        labels:
          severity: "page"
          owner: "foundation"
          product: "dotmac_erp"
        annotations:
          summary: "cache/queue availability"
          runbook: "#redis-down"
          recovery: "redis_up == 1"
          protects: "cache/queue availability"
          dedup_by: "instance"
      - alert: "FDN_REDIS_MEMORY_HIGH"
        expr: "redis_memory_used_bytes / redis_memory_max_bytes > 0.85"
        for: "600s"
        labels:
          severity: "ticket"
          owner: "foundation"
          product: "dotmac_erp"
        annotations:
          summary: "eviction risk"
          runbook: "#redis-mem-pressure"
          recovery: "ratio below threshold"
          protects: "eviction risk"
          dedup_by: "instance"
      - alert: "FDN_REDIS_PERSISTENCE_STALE"
        expr: "time() - redis_rdb_last_save_timestamp_seconds > 900"
        for: "600s"
        labels:
          severity: "ticket"
          owner: "foundation"
          product: "dotmac_erp"
        annotations:
          summary: "data-loss-on-restart exposure"
          runbook: "#redis-persistence-stale"
          recovery: "fresh save observed"
          protects: "data-loss-on-restart exposure"
          dedup_by: "instance"
      - alert: "FDN_REDIS_QUEUE_DEPTH_HIGH"
        expr: "redis_queue_depth{queue=~\".*\"} > 5000"
        for: "900s"
        labels:
          severity: "ticket"
          owner: "foundation"
          product: "dotmac_erp"
        annotations:
          summary: "queue backlog visibility"
          runbook: "#redis-queue-depth"
          recovery: "depth under threshold"
          protects: "queue backlog visibility"
          dedup_by: "instance,queue"
      - alert: "FDN_WORKER_BACKLOG_HIGH"
        expr: "worker_queue_backlog{queue=~\".*\"} > 1000"
        for: "900s"
        labels:
          severity: "ticket"
          owner: "foundation"
          product: "dotmac_erp"
        annotations:
          summary: "worker throughput SLO"
          runbook: "#worker-backlog"
          recovery: "depth under threshold"
          protects: "worker throughput SLO"
          dedup_by: "service,queue"
      - alert: "FDN_WORKER_FAILURE_RATE_HIGH"
        expr: "sum(rate(worker_task_failures_total[15m])) by (service,task) / sum(rate(worker_task_runs_total[15m])) by (service,task) > 0.05"
        for: "900s"
        labels:
          severity: "ticket"
          owner: "foundation"
          product: "dotmac_erp"
        annotations:
          summary: "job-success SLO"
          runbook: "#worker-failure-rate"
          recovery: "ratio under threshold"
          protects: "job-success SLO"
          dedup_by: "service,task"
      - alert: "FDN_WORKER_HEARTBEAT_STALE"
        expr: "time() - worker_last_success_timestamp_seconds{task=~\".*\"} > 600"
        for: "300s"
        labels:
          severity: "page"
          owner: "foundation"
          product: "dotmac_erp"
        annotations:
          summary: "dead-man for scheduled work"
          runbook: "#worker-heartbeat-stale"
          recovery: "fresh success observed"
          protects: "dead-man for scheduled work"
          dedup_by: "service,task"
      - alert: "FDN_WORKER_POISON_JOBS_DETECTED"
        expr: "increase(worker_task_poison_total[30m]) > 5"
        for: "600s"
        labels:
          severity: "ticket"
          owner: "foundation"
          product: "dotmac_erp"
        annotations:
          summary: "queue-blocking prevention"
          runbook: "#worker-poison-job"
          recovery: "0 increase for 30m"
          protects: "queue-blocking prevention"
          dedup_by: "service,task"
      - alert: "FDN_SCHEDULER_TICK_STALE"
        expr: "time() - scheduler_last_tick_timestamp_seconds{job=~\".*\"} > 900"
        for: "600s"
        labels:
          severity: "page"
          owner: "foundation"
          product: "dotmac_erp"
        annotations:
          summary: "scheduled-job liveness"
          runbook: "#scheduler-tick-stale"
          recovery: "fresh tick observed"
          protects: "scheduled-job liveness"
          dedup_by: "service,job"
      - alert: "FDN_OUTBOX_BACKLOG_HIGH"
        expr: "outbox_queue_depth{state=\"pending\"} > 500"
        for: "900s"
        labels:
          severity: "ticket"
          owner: "foundation"
          product: "dotmac_erp"
        annotations:
          summary: "eventual-delivery SLO"
          runbook: "#outbox-backlog"
          recovery: "depth under threshold"
          protects: "eventual-delivery SLO"
          dedup_by: "service,outbox"
      - alert: "FDN_OUTBOX_RETRY_AGE_HIGH"
        expr: "outbox_oldest_pending_age_seconds > 1800"
        for: "900s"
        labels:
          severity: "ticket"
          owner: "foundation"
          product: "dotmac_erp"
        annotations:
          summary: "delivery-latency SLO (age hides behind depth)"
          runbook: "#outbox-retry-age"
          recovery: "age under threshold"
          protects: "delivery-latency SLO (age hides behind depth)"
          dedup_by: "service,outbox"
      - alert: "FDN_OUTBOX_DEAD_LETTERS_PRESENT"
        expr: "outbox_dead_letter_count > 0"
        for: "1800s"
        labels:
          severity: "ticket"
          owner: "foundation"
          product: "dotmac_erp"
        annotations:
          summary: "no-silent-data-loss invariant"
          runbook: "#outbox-dead-letters"
          recovery: "count back to 0 or acked"
          protects: "no-silent-data-loss invariant"
          dedup_by: "service,outbox"
      - alert: "FDN_INBOX_BACKLOG_HIGH"
        expr: "inbox_queue_depth{state=\"unprocessed\"} > 500"
        for: "900s"
        labels:
          severity: "ticket"
          owner: "foundation"
          product: "dotmac_erp"
        annotations:
          summary: "inbound-processing SLO"
          runbook: "#inbox-backlog"
          recovery: "depth under threshold"
          protects: "inbound-processing SLO"
          dedup_by: "service,inbox"
      - alert: "FDN_INBOX_RETRY_AGE_HIGH"
        expr: "inbox_oldest_unprocessed_age_seconds > 1800"
        for: "900s"
        labels:
          severity: "ticket"
          owner: "foundation"
          product: "dotmac_erp"
        annotations:
          summary: "inbound-processing latency"
          runbook: "#inbox-retry-age"
          recovery: "age under threshold"
          protects: "inbound-processing latency"
          dedup_by: "service,inbox"
      - alert: "FDN_INBOX_DEAD_LETTERS_PRESENT"
        expr: "inbox_dead_letter_count > 0"
        for: "1800s"
        labels:
          severity: "ticket"
          owner: "foundation"
          product: "dotmac_erp"
        annotations:
          summary: "no-silent-data-loss invariant"
          runbook: "#inbox-dead-letters"
          recovery: "count back to 0 or acked"
          protects: "no-silent-data-loss invariant"
          dedup_by: "service,inbox"
      - alert: "FDN_INGRESS_4XX_RATE_HIGH"
        expr: "sum(rate(ingress_requests_total{status=~\"4..\"}[10m])) by (vhost) / sum(rate(ingress_requests_total[10m])) by (vhost) > 0.25"
        for: "900s"
        labels:
          severity: "ticket"
          owner: "foundation"
          product: "dotmac_erp"
        annotations:
          summary: "client-error surge / probing detection"
          runbook: "#ingress-4xx"
          recovery: "ratio under threshold"
          protects: "client-error surge / probing detection"
          dedup_by: "vhost"
      - alert: "FDN_INGRESS_5XX_RATE_HIGH"
        expr: "sum(rate(ingress_requests_total{status=~\"5..\"}[5m])) by (vhost) / sum(rate(ingress_requests_total[5m])) by (vhost) > 0.02"
        for: "300s"
        labels:
          severity: "page"
          owner: "foundation"
          product: "dotmac_erp"
        annotations:
          summary: "edge availability SLO"
          runbook: "#ingress-5xx"
          recovery: "ratio under threshold"
          protects: "edge availability SLO"
          dedup_by: "vhost"
      - alert: "FDN_INGRESS_UPSTREAM_LATENCY_HIGH"
        expr: "histogram_quantile(0.99, sum(rate(ingress_upstream_response_seconds_bucket[5m])) by (le,vhost)) > 3.0"
        for: "600s"
        labels:
          severity: "ticket"
          owner: "foundation"
          product: "dotmac_erp"
        annotations:
          summary: "upstream-latency SLO"
          runbook: "#ingress-upstream-latency"
          recovery: "p99 under threshold"
          protects: "upstream-latency SLO"
          dedup_by: "vhost"
      - alert: "FDN_TLS_CERT_EXPIRY_WARNING"
        expr: "(probe_ssl_earliest_cert_expiry - time()) / 86400 < 21"
        for: "3600s"
        labels:
          severity: "ticket"
          owner: "foundation"
          product: "dotmac_erp"
        annotations:
          summary: "outage-by-expired-cert prevention"
          runbook: "#tls-expiry"
          recovery: "renewed cert observed"
          protects: "outage-by-expired-cert prevention"
          dedup_by: "hostname"
      - alert: "FDN_TLS_CERT_EXPIRY_CRITICAL"
        expr: "(probe_ssl_earliest_cert_expiry - time()) / 86400 < 7"
        for: "3600s"
        labels:
          severity: "page"
          owner: "foundation"
          product: "dotmac_erp"
        annotations:
          summary: "outage-by-expired-cert prevention"
          runbook: "#tls-expiry"
          recovery: "renewed cert observed"
          protects: "outage-by-expired-cert prevention"
          dedup_by: "hostname"
      - alert: "FDN_EXTERNAL_DEP_LATENCY_HIGH"
        expr: "histogram_quantile(0.95, sum(rate(external_dependency_request_duration_seconds_bucket[10m])) by (le,service,dependency)) > 5.0"
        for: "900s"
        labels:
          severity: "ticket"
          owner: "foundation"
          product: "dotmac_erp"
        annotations:
          summary: "external-call latency SLO"
          runbook: "#external-dep-latency"
          recovery: "p95 under threshold"
          protects: "external-call latency SLO"
          dedup_by: "service,dependency"
      - alert: "FDN_EXTERNAL_DEP_ERROR_RATE_HIGH"
        expr: "sum(rate(external_dependency_requests_total{outcome=\"error\"}[10m])) by (service,dependency) / sum(rate(external_dependency_requests_total[10m])) by (service,dependency) > 0.10"
        for: "900s"
        labels:
          severity: "ticket"
          owner: "foundation"
          product: "dotmac_erp"
        annotations:
          summary: "external-call error SLO"
          runbook: "#external-dep-errors"
          recovery: "ratio under threshold"
          protects: "external-call error SLO"
          dedup_by: "service,dependency"
      - alert: "FDN_EXTERNAL_DEP_BREAKER_OPEN"
        expr: "external_dependency_circuit_open{dependency=~\".*\"} == 1"
        for: "300s"
        labels:
          severity: "page"
          owner: "foundation"
          product: "dotmac_erp"
        annotations:
          summary: "cascading-failure prevention"
          runbook: "#external-dep-breaker-open"
          recovery: "circuit closed for 5m"
          protects: "cascading-failure prevention"
          dedup_by: "service,dependency"
      - alert: "FDN_SECRET_REFRESH_FAILED"
        expr: "time() - secret_refresh_last_success_timestamp_seconds{secret=~\".*\"} > 2 * 3600"
        for: "300s"
        labels:
          severity: "page"
          owner: "foundation"
          product: "dotmac_erp"
        annotations:
          summary: "rotation correctness (ADR-0009 boundary)"
          runbook: "#secret-refresh-failed"
          recovery: "successful refresh observed"
          protects: "rotation correctness (ADR-0009 boundary)"
          dedup_by: "service,secret_name"
      - alert: "FDN_SECRET_MATERIAL_EXPIRING"
        expr: "(secret_material_expiry_timestamp_seconds{secret=~\".*\"} - time()) / 86400 < 30"
        for: "3600s"
        labels:
          severity: "ticket"
          owner: "foundation"
          product: "dotmac_erp"
        annotations:
          summary: "rotation lead time"
          runbook: "#secret-expiring"
          recovery: "new material installed"
          protects: "rotation lead time"
          dedup_by: "service,secret_name"
      - alert: "FDN_OBJSTORE_FAILURE_RATE_HIGH"
        expr: "sum(rate(objstore_requests_total{outcome=\"error\"}[10m])) by (bucket) / sum(rate(objstore_requests_total[10m])) by (bucket) > 0.05"
        for: "900s"
        labels:
          severity: "ticket"
          owner: "foundation"
          product: "dotmac_erp"
        annotations:
          summary: "storage-dependent-feature SLO"
          runbook: "#objstore-failures"
          recovery: "ratio under threshold"
          protects: "storage-dependent-feature SLO"
          dedup_by: "bucket"
      - alert: "FDN_OBJSTORE_CAPACITY_HIGH"
        expr: "objstore_used_bytes{bucket=~\".*\"} / objstore_quota_bytes{bucket=~\".*\"} > 0.85"
        for: "3600s"
        labels:
          severity: "ticket"
          owner: "foundation"
          product: "dotmac_erp"
        annotations:
          summary: "capacity exhaustion"
          runbook: "#objstore-capacity"
          recovery: "ratio under threshold"
          protects: "capacity exhaustion"
          dedup_by: "bucket"
      - alert: "FDN_BACKUP_AGE_STALE"
        expr: "time() - backup_last_success_timestamp_seconds{database=~\".*\"} > 86400 * 2"
        for: "900s"
        labels:
          severity: "page"
          owner: "foundation"
          product: "dotmac_erp"
        annotations:
          summary: "RPO"
          runbook: "#backup-stale"
          recovery: "fresh success observed"
          protects: "RPO"
          dedup_by: "database"
      - alert: "FDN_BACKUP_JOB_FAILED"
        expr: "increase(backup_job_failures_total{database=~\".*\"}[1d]) > 0"
        for: "0s"
        labels:
          severity: "page"
          owner: "foundation"
          product: "dotmac_erp"
        annotations:
          summary: "RPO"
          runbook: "#backup-failed"
          recovery: "next run succeeds"
          protects: "RPO"
          dedup_by: "database,run_id"
      - alert: "FDN_RESTORE_NOT_VERIFIED"
        expr: "time() - backup_last_restore_verified_timestamp_seconds{database=~\".*\"} > 30 * 86400"
        for: "86400s"
        labels:
          severity: "ticket"
          owner: "foundation"
          product: "dotmac_erp"
        annotations:
          summary: "RTO confidence"
          runbook: "#restore-not-verified"
          recovery: "drill recorded"
          protects: "RTO confidence"
          dedup_by: "database"
      - alert: "FDN_IMAGE_DRIFT_DETECTED"
        expr: "deployed_image_digest{service=~\".*\"} != on(service) desired_image_digest"
        for: "300s"
        labels:
          severity: "ticket"
          owner: "foundation"
          product: "dotmac_erp"
        annotations:
          summary: "supply-chain/deploy correctness"
          runbook: "#image-drift"
          recovery: "digests match"
          protects: "supply-chain/deploy correctness"
          dedup_by: "service,instance"
      - alert: "FDN_CONFIG_DRIFT_DETECTED"
        expr: "deployed_config_digest{service=~\".*\"} != on(service) desired_config_digest"
        for: "300s"
        labels:
          severity: "ticket"
          owner: "foundation"
          product: "dotmac_erp"
        annotations:
          summary: "config correctness"
          runbook: "#config-drift"
          recovery: "digests match"
          protects: "config correctness"
          dedup_by: "service,instance"
      - alert: "FDN_MANIFEST_DRIFT_DETECTED"
        expr: "deployed_manifest_digest{product=~\".*\"} != on(product) approved_manifest_digest"
        for: "300s"
        labels:
          severity: "ticket"
          owner: "foundation"
          product: "dotmac_erp"
        annotations:
          summary: "approved-plan conformance"
          runbook: "#manifest-drift"
          recovery: "digests match"
          protects: "approved-plan conformance"
          dedup_by: "product"
      - alert: "FDN_SYNTHETIC_HEALTH_FAILING"
        expr: "probe_success{probe=\"synthetic_health\",product=~\".*\"} == 0"
        for: "300s"
        labels:
          severity: "page"
          owner: "foundation"
          product: "dotmac_erp"
        annotations:
          summary: "end-to-end reachability"
          runbook: "#synthetic-health-fail"
          recovery: "3 consecutive successes"
          protects: "end-to-end reachability"
          dedup_by: "product"
      - alert: "FDN_SYNTHETIC_JOURNEY_FAILING"
        expr: "increase(synthetic_journey_failures_total{journey=~\".*\"}[15m]) >= 2"
        for: "0s"
        labels:
          severity: "page"
          owner: "foundation"
          product: "dotmac_erp"
        annotations:
          summary: "end-to-end customer-facing correctness"
          runbook: "#synthetic-journey-fail"
          recovery: "1 success observed"
          protects: "end-to-end customer-facing correctness"
          dedup_by: "product,journey"
      - alert: "FDN_SCRAPE_TARGET_DOWN"
        expr: "up{job=~\".*\"} == 0"
        for: "300s"
        labels:
          severity: "page"
          owner: "foundation"
          product: "dotmac_erp"
        annotations:
          summary: "telemetry pipeline (scrape) health"
          runbook: "#scrape-target-down"
          recovery: "up == 1"
          protects: "telemetry pipeline (scrape) health"
          dedup_by: "instance"
      - alert: "FDN_REMOTE_WRITE_FAILING"
        expr: "rate(prometheus_remote_storage_failed_samples_total[10m]) > 0"
        for: "600s"
        labels:
          severity: "page"
          owner: "foundation"
          product: "dotmac_erp"
        annotations:
          summary: "metrics durability"
          runbook: "#remote-write-failing"
          recovery: "0 failures for 10m"
          protects: "metrics durability"
          dedup_by: "instance"
      - alert: "FDN_LOG_INGESTION_GAP"
        expr: "absent_over_time(log_lines_received_total{instance=~\".+\"}[15m])"
        for: "900s"
        labels:
          severity: "page"
          owner: "foundation"
          product: "dotmac_erp"
        annotations:
          summary: "log-pipeline dead-man"
          runbook: "#log-ingest-gap"
          recovery: "logs resume"
          protects: "log-pipeline dead-man"
          dedup_by: "instance"
      - alert: "FDN_TRACE_EXPORT_FAILING"
        expr: "rate(otel_exporter_send_failed_spans_total[15m]) > 0"
        for: "900s"
        labels:
          severity: "ticket"
          owner: "foundation"
          product: "dotmac_erp"
        annotations:
          summary: "trace completeness"
          runbook: "#trace-export-failing"
          recovery: "0 failures for 15m"
          protects: "trace completeness"
          dedup_by: "instance"
      - alert: "FDN_TELEMETRY_DEADMAN"
        expr: "absent(deadman_heartbeat_total)"
        for: "300s"
        labels:
          severity: "page"
          owner: "foundation"
          product: "dotmac_erp"
        annotations:
          summary: "pipeline-is-alive invariant, distinct from \"everything is quiet\""
          runbook: "#deadman-silent"
          recovery: "heartbeat resumes"
          protects: "pipeline-is-alive invariant, distinct from \"everything is quiet\""
          dedup_by: "fleet"
  - name: "dotmac_product_dotmac_erp"
    rules:
      - alert: "GL_UNPOSTED_BATCH_STALLED"
        expr: "increase(job_runs_total{task=\"post_approved_journal_backlog\",status=\"success\"}[30m]) == 0"
        for: "1800s"
        labels:
          severity: "ticket"
          owner: "finance-platform-oncall"
          product: "dotmac_erp"
        annotations:
          summary: "No successful GL journal-backlog posting run in 30 minutes; approved journal entries are not reaching POSTED."
          runbook: "No dedicated runbook exists yet. First checks: `worker` container logs for post_approved_journal_backlog exceptions; Celery queue depth; whether the DB or Redis dependency checks are degraded."
          recovery: "increase(job_runs_total{task=\"post_approved_journal_backlog\",status=\"success\"}[30m]) > 0"
          protects: "Period close and trial-balance accuracy depend on approved journals reaching POSTED without unbounded delay."
          dedup_by: "product,environment,alert"
      - alert: "AP_PAYMENT_POSTING_STALLED"
        expr: "increase(job_runs_total{task=\"post_unposted_ap_invoices\",status=\"success\"}[30m]) == 0"
        for: "1800s"
        labels:
          severity: "page"
          owner: "finance-platform-oncall"
          product: "dotmac_erp"
        annotations:
          summary: "No successful AP invoice-posting run in 30 minutes; approved supplier invoices/payments are not moving forward."
          runbook: "No dedicated runbook exists yet. First checks: worker logs for post_unposted_ap_invoices exceptions; upstream bank/Paystack integration health via /health/monitoring."
          recovery: "increase(job_runs_total{task=\"post_unposted_ap_invoices\",status=\"success\"}[30m]) > 0"
          protects: "Vendor payment obligations and supplier trust depend on AP postings not silently stalling."
          dedup_by: "product,environment,alert"
      - alert: "PAYROLL_DRAFT_GENERATION_FAILED"
        expr: "increase(job_runs_total{task=\"auto_generate_draft_payroll\",status=\"failure\"}[1h]) > 0"
        for: "3600s"
        labels:
          severity: "page"
          owner: "people-platform-oncall"
          product: "dotmac_erp"
        annotations:
          summary: "auto_generate_draft_payroll has failed at least once in the last hour; a payroll run may not have been created on schedule."
          runbook: "No dedicated runbook exists yet. First checks: worker logs for auto_generate_draft_payroll traceback; whether a draft PayrollEntry (PayrollEntryStatus.DRAFT) exists for the expected period."
          recovery: "increase(job_runs_total{task=\"auto_generate_draft_payroll\",status=\"failure\"}[1h]) == 0"
          protects: "Payroll runs on a fixed statutory/pay-period calendar; a missed or failed draft generation directly threatens on-time pay."
          dedup_by: "product,environment,alert"
      - alert: "IMPORT_BACKLOG_STALLED"
        expr: "increase(job_runs_total{task=\"process_customer_import_partitions\",status=\"failure\"}[1h]) > 3"
        for: "3600s"
        labels:
          severity: "ticket"
          owner: "data-platform-oncall"
          product: "dotmac_erp"
        annotations:
          summary: "More than 3 failed customer-import partition runs in the last hour; the bulk-import backlog is not draining cleanly."
          runbook: "No dedicated runbook exists yet. First checks: worker logs for process_customer_import_partitions exceptions; the relevant ImportRun's per-row outcome ledger (dotmac-imports)."
          recovery: "increase(job_runs_total{task=\"process_customer_import_partitions\",status=\"failure\"}[1h]) <= 3"
          protects: "Customer bulk-import correctness and the promotion gate that depends on a clean dry-run/apply partition run."
          dedup_by: "product,environment,alert"
      - alert: "GL_POSTING_LATENCY_HIGH"
        expr: "histogram_quantile(0.95, sum(rate(job_duration_seconds_bucket{task=\"post_approved_journal_backlog\"}[10m])) by (le)) > 60"
        for: "600s"
        labels:
          severity: "info"
          owner: "finance-platform-oncall"
          product: "dotmac_erp"
        annotations:
          summary: "p95 GL journal-backlog posting duration exceeds 60s; posting is slow rather than failed outright."
          runbook: "No dedicated runbook exists yet. First checks: DB lock contention on journal_entry/journal_entry_line tables; organization_id cardinality in the current backlog."
          recovery: "histogram_quantile(0.95, sum(rate(job_duration_seconds_bucket{task=\"post_approved_journal_backlog\"}[10m])) by (le)) <= 60"
          protects: "Early warning before GL_UNPOSTED_BATCH_STALLED fires outright; slow posting degrades close-process confidence before it fully stalls."
          dedup_by: "product,environment,alert"
