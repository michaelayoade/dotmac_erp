
exclude: ^\.seabone/
repos:
  # Ruff: fast linting + formatting (replaces flake8, isort, black)
  #
  # Both hooks carry an explicit `exclude:` naming the strict-JSON evidence
  # documents (docs/kernel-runtime-{composition,readiness}.json), even
  # though ruff-pre-commit's own hook manifest already restricts these hooks
  # to `types_or: [python, pyi]` and neither `make format`/`make
  # format-check`'s directory-wide `ruff format .` nor CI's `--all-files`
  # run ever reaches a .json file today (verified directly: `ruff format
  # --check .` from the repo root does not even mention either file). The
  # explicit exclude is defense-in-depth against the one path that DOES
  # reach them regardless of extension: `ruff format <path.json>` invoked
  # directly with the file named on the command line (e.g. a future
  # `pre-commit run --files docs/kernel-runtime-composition.json`, or a
  # script that globs docs/*.json into a formatter call) rewrites the file
  # into JSON5/JSONC shape — trailing commas — which is no longer strict
  # JSON. These two files are read by another repository's gate as DATA,
  # never as Python, and must stay parseable by `json.load` with zero
  # tolerance; see the `strict-json-evidence-documents` local hook below,
  # which runs AFTER this block specifically to catch a formatter that
  # mangled one of them regardless of how it was invoked.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.0
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
        exclude: ^docs/kernel-runtime-(composition|readiness)\.json$
      - id: ruff-format
        exclude: ^docs/kernel-runtime-(composition|readiness)\.json$

  # Strict-JSON evidence documents: composition/readiness records another
  # repository's gate reads as data. Runs AFTER the ruff block above (hook
  # execution follows this file's order) so it catches a formatter -- or
  # anything else -- that has mangled one of them into invalid JSON, rather
  # than running first and being silently masked by a later step. See
  # scripts/check_evidence_json.py's own docstring for the full rationale
  # and the sensitivity proof in
  # tests/architecture/test_strict_json_evidence_documents.py.
  - repo: local
    hooks:
      - id: strict-json-evidence-documents
        name: strict JSON evidence documents parse after formatting
        language: system
        entry: python3 scripts/check_evidence_json.py
        pass_filenames: false
        files: ^docs/kernel-runtime-(composition|readiness)\.json$
        always_run: true

  # Standard pre-commit hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: check-merge-conflict
      - id: debug-statements  # no pdb/breakpoint() in commits
      - id: detect-private-key  # catch accidental key commits

  # Security: bandit static analysis
  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.3
    hooks:
      - id: bandit
        args: [-c, pyproject.toml, -q]
        additional_dependencies: ["bandit[toml]"]
        exclude: (tests/|alembic/|scripts/)

  # Semgrep has an isolated environment because its OpenTelemetry requirement
  # conflicts with ERP's runtime pin. This immutable revision is tag v1.173.0;
  # that hook's setup.py installs exactly semgrep==1.173.0.
  - repo: https://github.com/semgrep/pre-commit
    rev: c33ffee4d59183b43c9dac34963d1d74d430028e  # pragma: allowlist secret
    hooks:
      - id: semgrep
        args:
          - --disable-version-check
          - --quiet
          - --skip-unknown-extensions
          - --config
          - .semgrep/
          - --error
          - --severity
          - ERROR
          - --no-git-ignore
          - app/
        # Preserve `make check`'s whole-app scan, including an untracked new
        # Python file; pre-commit's tracked-file list is only the trigger.
        pass_filenames: false
        types: [python]
        exclude: (tests/|alembic/|scripts/)

  - repo: local
    hooks:
      - id: session-context
        name: session-context (no raw SessionLocal() at non-HTTP entry points)
        language: system
        entry: python3 scripts/check_session_context.py
        # Every entry point that runs outside the request lifecycle. scripts/
        # holds a ratchet of grandfathered offenders (see
        # scripts/session_context_legacy.txt); archive/ is retired one-offs.
        files: ^(app/tasks|app/tools|scripts)/.*\.py$
        exclude: ^scripts/archive/

      - id: template-a11y
        name: template a11y (no new unlabeled controls / nameless icons)
        language: system
        entry: python3 scripts/audit_template_a11y.py
        pass_filenames: false
        files: ^templates/.*\.html$

      - id: template-color-only
        name: template color-only status (no new color-only status dots)
        language: system
        entry: python3 scripts/audit_color_only.py
        pass_filenames: false
        files: ^templates/.*\.html$

  # Security: detect hardcoded secrets
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: [--baseline, .secrets.baseline]
        # Python is excluded because it is COVERED, not because it is trusted:
        # tests/architecture/test_no_committed_credentials.py walks the AST of
        # every tracked .py file — including scripts/, which this hook has
        # always skipped and where all four previously-committed credentials
        # actually lived. It asks a decidable question (is there a literal
        # value bound to a credential-named target?) instead of an
        # entropy heuristic, so it has no baseline to accumulate in.
        #
        # This hook keeps the file types that guard cannot parse: YAML, JSON,
        # Markdown, HTML, SQL, .env.
        #
        # The v3 composition record is a closed digest-only envelope. The
        # SHA-pinned verifier rejects unknown keys, invalid digests, changed
        # source bytes, and changed selected bytes. Its expected public hashes
        # deliberately trigger the entropy heuristic eleven times, while no
        # arbitrary value can pass the envelope verifier. Exclude exactly that
        # machine record from this heuristic; readiness.json and every other
        # JSON/YAML/Markdown file remain scanned.
        exclude: (\.env\.example|tests/|alembic/|scripts/|docs/kernel-runtime-composition\.json|\.py$)
