# vmagent scrape config: collect this deployment's own metrics and remote-write
# them to the central Dotmac Observability stack.
#
# Push rather than central pull, matching dotmac_sub: no inbound firewall rule
# is needed on this host, and vmagent buffers on disk if the central endpoint is
# briefly unreachable instead of leaving a hole in the series.
#
# The remote-write target is NOT set here — it is the -remoteWrite.url flag in
# docker-compose.yml, sourced from VM_REMOTE_WRITE_URL in .env.

global:
  scrape_interval: 60s
  scrape_timeout: 30s
  external_labels:
    app: dotmac_erp
    environment: ${DEPLOY_ENV}

scrape_configs:
  - job_name: 'dotmac-erp-app'
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials: '%{METRICS_TOKEN}'
    static_configs:
      # Container port over the compose network. Note this is 8002, not the
      # 8003 published on the host — and not app-dev, which also listens on 8002
      # but only under the dev profile.
      - targets: ['app:8002']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'dotmac-erp-app'

  - job_name: 'dotmac-erp-worker'
    metrics_path: /metrics
    static_configs:
      - targets: ['worker:8004']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'dotmac-erp-worker'
